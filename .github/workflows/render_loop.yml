name: AetherCombine 4K Heavy Loop to Google Drive

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'JSON манифест сборки напрямую из студии'
        required: true
        type: string
      gdrive_folder_id:
        description: 'ID папки Google Drive с исходниками и для выгрузки'
        required: false
        type: string

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip rclone

      - name: Setup Rclone Config
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: Prepare Manifest
        run: |
          cat << 'EOF' > current_manifest.json
          ${{ inputs.manifest_json }}
          EOF

      - name: Sync Clips from Google Drive via Rclone
        run: |
          mkdir -p input_clips
          # Получаем ID папки из инпута или из самого манифеста
          FOLDER_ID="${{ inputs.gdrive_folder_id }}"
          if [ -z "$FOLDER_ID" ]; then
            FOLDER_ID=$(python3 -c "import json; m=json.load(open('current_manifest.json')); print(m.get('cloud_export', {}).get('target_folder_id', ''))")
          fi
          echo "Скачиваем исходные ролики из Google Drive папки $FOLDER_ID..."
          rclone copy "gdrive:{$FOLDER_ID}" ./input_clips/ --include "*.mp4" -v
          echo "Файлы в input_clips:"
          ls -la ./input_clips/

      - name: Build and Run FFmpeg Pipeline
        run: |
          python3 assemble_pipeline.py current_manifest.json

      - name: Upload Output Video to Google Drive
        run: |
          FOLDER_ID="${{ inputs.gdrive_folder_id }}"
          if [ -z "$FOLDER_ID" ]; then
            FOLDER_ID=$(python3 -c "import json; m=json.load(open('current_manifest.json')); print(m.get('cloud_export', {}).get('target_folder_id', ''))")
          fi
          echo "Выгрузка готового 3-часового файла в Google Drive..."
          rclone copy ./output/ "gdrive:{$FOLDER_ID}" --include "*.mp4" -v
