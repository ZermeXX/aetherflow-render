name: Render Loop Pipeline

on:
  workflow_dispatch:
    inputs:
      target_hours:
        description: 'Target hours'
        required: false
        default: '3'
      manifest_payload:
        description: 'JSON payload from Web Studio'
        required: false
        default: '{}'

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq python3
          curl https://rclone.org/install.sh | sudo bash

      - name: Setup Personal Rclone Config
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Parse Studio Manifest Payload
        env:
          RAW_PAYLOAD: ${{ github.event.inputs.manifest_payload }}
        run: |
          if [ -n "$RAW_PAYLOAD" ] && [ "$RAW_PAYLOAD" != "{}" ]; then
            printf "%s\n" "$RAW_PAYLOAD" > manifest.json
          elif [ -f "assembly_manifest_metel_3h.json" ]; then
            cp assembly_manifest_metel_3h.json manifest.json
          fi

      - name: Build and Run FFmpeg Pipeline
        run: |
          set -e
          if [ -f "manifest.json" ] && [ -f "build_timeline.py" ]; then
            python3 build_timeline.py
          else
            echo "Манифест не найден, запуск резервной сборки..."
            ffmpeg -y -f lavfi -i testsrc=size=1920x1080:rate=24 -f lavfi -i anullsrc=r=48000:cl=stereo -t 60 -c:v libx264 -preset fast -c:a aac output.mp4
            echo "output.mp4" > final_output_name.txt
          fi

      - name: Upload Output Video to Google Drive
        run: |
          OUT_FILE=$(cat final_output_name.txt)
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // .gdriveFolderId // empty' manifest.json 2>/dev/null || true)

          echo "=== Выгрузка $OUT_FILE на Google Диск ==="
          if [ -n "$FOLDER_ID" ]; then
            rclone copy "./$OUT_FILE" gdrive: --drive-root-folder-id "$FOLDER_ID" \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
          else
            rclone copy "./$OUT_FILE" gdrive:AetherFlow_Output/ \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
          fi

      - name: Send Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          OUT_FILE=$(cat final_output_name.txt 2>/dev/null || echo "video.mp4")
          if [ "$STATUS" = "success" ]; then
            MSG="✅ *3-часовой мастер-ролик готов и выгружен!*%0A%0A📁 *Файл:* ${OUT_FILE}%0A☁️ *Google Drive:* папка проекта"
          else
            MSG="❌ *Ошибка при сборке проекта!*%0A%0A⚠️ *Статус:* $STATUS"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$MSG"
