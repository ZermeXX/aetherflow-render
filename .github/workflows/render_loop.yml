name: AetherCombine 4K Heavy Loop to Google Drive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag with Assets'
        required: false
      manifest_payload:
        description: 'Base64 Encoded JSON Manifest'
        required: true

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Python
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3

      - name: Parse Manifest
        env:
          PAYLOAD: ${{ github.event.inputs.manifest_payload }}
        run: |
          python3 -c "
          import base64, json, os

          payload = os.environ.get('PAYLOAD', '')
          data = json.loads(base64.b64decode(payload).decode('utf-8'))

          with open('manifest.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)

          output_name = data.get('export_settings', {}).get('output_filename', 'SN_FINAL_Metel_3h_16x9.mp4')
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'OUTPUT_FILENAME={output_name}\n')
          "

      - name: Download Clips from Release Buffer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          mkdir -p input_clips
          if [ -n "$TAG" ]; then
            echo "Скачивание исходных клипов из временного буфера релиза $TAG..."
            gh release download "$TAG" --dir input_clips --repo ${{ github.repository }}
          else
            echo "Тег релиза не передан, поиск файлов в локальном репозитории..."
          fi
          ls -la input_clips/

      - name: Build and Run FFmpeg Pipeline
        run: |
          python3 assemble_pipeline.py

      - name: Upload Output Video to GitHub Release
        if: github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          echo "Прикрепление готового мастера к релизу $TAG..."
          gh release upload "$TAG" "$OUTPUT_FILENAME" --clobber --repo ${{ github.repository }}
          echo "Готово! Видео доступно для скачивания на вкладке Releases."
