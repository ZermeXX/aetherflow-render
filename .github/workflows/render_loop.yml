name: AetherCombine 4K Heavy Loop to Google Drive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag of GitHub Release buffer (optional)'
        required: false
        default: 'none'
        type: string
      manifest_payload:
        description: 'Base64 encoded manifest payload from Studio'
        required: true
        type: string

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Python & Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip rclone jq

      - name: Decode Manifest Payload
        run: |
          echo "${{ inputs.manifest_payload }}" | base64 -d > current_manifest.json
          echo "Декодированный манифест:"
          cat current_manifest.json

      - name: Setup Service Account Rclone Config
        env:
          SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p ~/.config/rclone
          # Записываем сервисный аккаунт из секрета репозитория
          cat << 'EOF' > /home/runner/service_account.json
          ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          EOF

          # Формируем секцию gdrive
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /home/runner/service_account.json
          EOF

          echo "Доступные подключения Rclone:"
          rclone listremotes

      - name: Download Clips from Google Drive
        run: |
          mkdir -p input_clips

          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // empty' current_manifest.json)
          echo "Целевой ID папки Google Drive: '$FOLDER_ID'"

          if [ -z "$FOLDER_ID" ] || [ "$FOLDER_ID" = "null" ]; then
            echo "::error::ID папки Google Drive не найден в манифесте!"
            exit 1
          fi

          echo "Скачиваем исходные ролики из Google Drive..."
          rclone copy "gdrive:" ./input_clips/ \
            --drive-root-folder-id "$FOLDER_ID" \
            --include "*.mp4" \
            -v

          echo "Файлы в папке input_clips:"
          ls -la ./input_clips/

      - name: Download Clips from Release Buffer (Fallback)
        if: inputs.release_tag != 'none' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Проверка релиз-буфера ${{ inputs.release_tag }}..."
          gh release download "${{ inputs.release_tag }}" --dir ./input_clips || true

      - name: Check Input Files
        run: |
          echo "Итоговый список файлов для сборки:"
          ls -la ./input_clips/
          if [ -z "$(ls -A ./input_clips/*.mp4 2>/dev/null)" ]; then
            echo "::error::В папке input_clips нет файлов .mp4! Проверьте, расшарена ли папка Google Drive (1OuuxKa85KAR-zz9TFXv6Ccg99fZ6JpuK) на email сервисного аккаунта."
            exit 1
          fi

      - name: Build and Run FFmpeg Pipeline
        run: |
          python3 assemble_pipeline.py current_manifest.json

      - name: Upload Output Video to Google Drive
        run: |
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // empty' current_manifest.json)
          if [ -n "$FOLDER_ID" ] && [ "$FOLDER_ID" != "null" ]; then
            echo "Выгрузка готового мастера в Google Drive..."
            rclone copy ./output/ "gdrive:" \
              --drive-root-folder-id "$FOLDER_ID" \
              --include "*.mp4" \
              -v
          fi
