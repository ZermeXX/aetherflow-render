name: Render Loop Pipeline

on:
  workflow_dispatch:
    inputs:
      target_hours:
        description: 'Target hours'
        required: false
        default: '3'
      manifest_payload:
        description: 'JSON payload from Web Studio'
        required: false
        default: '{}'

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq python3
          curl https://rclone.org/install.sh | sudo bash

      - name: Parse Studio Manifest Payload
        env:
          RAW_PAYLOAD: ${{ github.event.inputs.manifest_payload }}
        run: |
          mkdir -p temp_render
          if [ -n "$RAW_PAYLOAD" ] && [ "$RAW_PAYLOAD" != "{}" ]; then
            printf "%s\n" "$RAW_PAYLOAD" > manifest.json
            echo "Манифест из приложения успешно получен:"
            cat manifest.json
          else
            echo "Запуск без внешнего манифеста (используются локальные параметры)."
          fi

      - name: Setup Personal Rclone Config
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Build and Run FFmpeg Pipeline
        env:
          INPUT_HOURS: ${{ github.event.inputs.target_hours }}
        run: |
          set -e
          mkdir -p temp_render

          echo "=== 1. Render Base Slot ==="
          if [ -f "render_slot.sh" ]; then
            bash render_slot.sh
          elif [ -f "manifest.json" ] && [ -f "render_from_manifest.sh" ]; then
            bash render_from_manifest.sh
          elif [ -f "input_loop.mp4" ]; then
            ffmpeg -y -i input_loop.mp4 -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 320k temp_render/slot_master.mp4
          else
            ffmpeg -y -f lavfi -i testsrc=size=3840x2160:rate=24 -f lavfi -i anullsrc=r=48000:cl=stereo -t 900 -c:v libx264 -preset fast -crf 20 -c:a aac temp_render/slot_master.mp4
          fi

          echo "=== 2. Build Seamless Loop ==="
          SLOT_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 temp_render/slot_master.mp4)
          SLOT_SECS=${SLOT_DURATION%.*}
          if [ -z "$SLOT_SECS" ] || [ "$SLOT_SECS" -le 0 ]; then
            SLOT_SECS=900
          fi

          # Берем длительность из манифеста (если передана) или из target_hours
          HOURS="$INPUT_HOURS"
          if [ -f "manifest.json" ]; then
            MANIFEST_H=$(jq -r '.targetHours // .target_hours // empty' manifest.json 2>/dev/null || true)
            if [ -n "$MANIFEST_H" ]; then
              HOURS="$MANIFEST_H"
            fi
          fi
          if [ -z "$HOURS" ]; then
            HOURS=3
          fi
          TARGET_SECS=$(( HOURS * 3600 ))

          REPEATS=$(( (TARGET_SECS + SLOT_SECS - 1) / SLOT_SECS ))
          echo "Slot: ${SLOT_SECS}s. Repeats: ${REPEATS}"

          > temp_render/loop_list.txt
          for i in $(seq 1 $REPEATS); do
            echo "file '$(pwd)/temp_render/slot_master.mp4'" >> temp_render/loop_list.txt
          done

          ffmpeg -y -f concat -safe 0 -i temp_render/loop_list.txt -t $TARGET_SECS -c copy output.mp4
          ls -lh output.mp4

      - name: Upload Output Video to Google Drive
        run: |
          echo "=== Uploading to Google Drive ==="
          FOLDER_ID=""
          if [ -f "manifest.json" ]; then
            FOLDER_ID=$(jq -r '.gdriveFolderId // .folderId // .gdrive_folder_id // empty' manifest.json 2>/dev/null || true)
          fi

          if [ -n "$FOLDER_ID" ]; then
            echo "Выгрузка в целевую папку по ID: $FOLDER_ID"
            rclone copy ./output.mp4 gdrive: --drive-root-folder-id "$FOLDER_ID" \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
          else
            rclone copy ./output.mp4 gdrive:AetherFlow_Output/ \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
          fi

      - name: Send Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ *3-hour Loop successfully created and uploaded!*%0A%0A📁 File: output.mp4%0A☁️ Target: Google Drive"
          else
            MSG="❌ *Pipeline Failed!*%0A%0A⚠️ Status: $STATUS"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$MSG"
