name: Render Loop Pipeline

on:
  workflow_dispatch:
    inputs:
      target_hours:
        description: 'Target hours'
        required: false
        default: '3'
      manifest_payload:
        description: 'JSON or Base64 payload from Web Studio'
        required: false
        default: '{}'
      preflight_only:
        description: 'Check assets on Google Drive without rendering'
        required: false
        default: 'false'

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Record Start Time
        run: echo "START_TS=$(date +\%s)" >> $GITHUB_ENV

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq python3
          curl https://rclone.org/install.sh | sudo bash

      - name: Setup Personal Rclone Config
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Parse Studio Manifest Payload
        env:
          RAW_PAYLOAD: ${{ github.event.inputs.manifest_payload }}
        run: |
          python3 - << 'EOF'
          import os, base64, json, shutil, subprocess

          raw = os.environ.get("RAW_PAYLOAD", "").strip()
          manifest_saved = False

          if raw and raw != "{}":
              try:
                  data = json.loads(raw)
                  with open("manifest.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  manifest_saved = True
                  print("Получен прямой JSON из веб-приложения.")
              except Exception:
                  pass

              if not manifest_saved:
                  try:
                      decoded = base64.b64decode(raw).decode("utf-8")
                      data = json.loads(decoded)
                      with open("manifest.json", "w", encoding="utf-8") as f:
                          json.dump(data, f, ensure_ascii=False, indent=2)
                      manifest_saved = True
                      print("Получен Base64-манифест из веб-приложения.")
                  except Exception:
                      pass

          if not manifest_saved:
              if os.path.exists("assembly_manifest_metel_3h.json"):
                  shutil.copy("assembly_manifest_metel_3h.json", "manifest.json")
                  manifest_saved = True
                  print("Использован локальный assembly_manifest_metel_3h.json.")
              else:
                  print("Payload пуст — скачиваем актуальный *manifest*.json из Google Drive...")
                  subprocess.run([
                      "rclone", "copy", "gdrive:", ".",
                      "--drive-root-folder-id", "1OuuxKa85KAR-zz9TFXv6Ccg99fZ6JpuK",
                      "--include", "*manifest*.json", "-v"
                  ], check=False)
                  for fname in os.listdir("."):
                      if "manifest" in fname and fname.endswith(".json") and fname != "manifest.json":
                          os.rename(fname, "manifest.json")
                          manifest_saved = True
                          print(f"Скачан и подключен манифест: {fname}")
                          break

          if not os.path.exists("manifest.json") or os.path.getsize("manifest.json") == 0:
              raise RuntimeError("Не удалось получить непустой manifest.json!")
          EOF
          ls -lh manifest.json

      - name: Preflight Asset Check
        run: |
          python3 - << 'EOF'
          import json, subprocess

          with open("manifest.json", "r", encoding="utf-8") as f:
              m = json.load(f)

          folder_id = m.get("cloud_export", {}).get("target_folder_id", "1OuuxKa85KAR-zz9TFXv6Ccg99fZ6JpuK")
          needed = set()
          for s in m.get("timeline_slots", []):
              needed.add(s["base_content"]["file_name"])
              for ins in s.get("inserts", []):
                  needed.add(ins["file_name"])

          out = subprocess.check_output([
              "rclone", "lsf", "gdrive:", "--drive-root-folder-id", folder_id
          ]).decode("utf-8").splitlines()
          existing = set(x.strip() for x in out)

          missing = sorted(needed - existing)
          if missing:
              raise FileNotFoundError(f"На Google Диске отсутствуют файлы: {', '.join(missing)}")
          print(f"✅ Все {len(needed)} исходных клипов и врезок подтверждены на Google Диске!")
          EOF

      - name: Build and Run FFmpeg Pipeline
        if: github.event.inputs.preflight_only != 'true'
        run: |
          set -e
          python3 build_timeline.py

      - name: Generate Vertical Shorts & Release Card
        if: github.event.inputs.preflight_only != 'true'
        run: |
          python3 shorts_factory.py
          python3 - << 'EOF'
          import json, os

          with open("manifest.json", "r", encoding="utf-8") as f:
              m = json.load(f)
          with open("final_output_name.txt", "r", encoding="utf-8") as f:
              out_file = f.read().strip()

          qc = {}
          if os.path.exists("qc_report.json"):
              with open("qc_report.json", "r", encoding="utf-8") as f:
                  qc = json.load(f)

          chapters = ""
          ch_file = f"{os.path.splitext(out_file)[0]}_chapters.txt"
          if os.path.exists(ch_file):
              with open(ch_file, "r", encoding="utf-8") as f:
                  chapters = f.read()

          seo = m.get("youtube_seo", {})
          card = [
              f"# RELEASE CARD: {seo.get('title') or out_file}",
              "",
              f"- **Файл мастера:** `{out_file}`",
              f"- **Хронометраж:** {qc.get('duration_formatted', 'N/A')}",
              f"- **Громкость (EBU R128):** {qc.get('integrated_lufs', 'N/A')} LUFS",
              "",
              "## Описание для YouTube",
              seo.get("description", "(не задано в манифесте)"),
              "",
              "## Таймкоды (Chapters)",
              "```text",
              chapters.strip(),
              "```",
              "",
              "## Теги",
              ", ".join(seo.get("tags", []))
          ]
          with open("RELEASE_CARD.md", "w", encoding="utf-8") as f:
              f.write("\n".join(card) + "\n")
          EOF

      - name: Upload Output Video, Shorts & Metadata to Google Drive
        if: github.event.inputs.preflight_only != 'true'
        run: |
          OUT_FILE=$(cat final_output_name.txt)
          CHAPTERS_FILE=$(cat final_chapters_name.txt 2>/dev/null || echo "")
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // .gdriveFolderId // empty' manifest.json 2>/dev/null || true)

          echo "=== Выгрузка $OUT_FILE, таймкодов, карточки релиза и Shorts на Google Диск ==="
          if [ -n "$FOLDER_ID" ]; then
            rclone copy "./$OUT_FILE" gdrive: --drive-root-folder-id "$FOLDER_ID" \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
            [ -f "./$CHAPTERS_FILE" ] && rclone copy "./$CHAPTERS_FILE" gdrive: --drive-root-folder-id "$FOLDER_ID" -v
            [ -f "RELEASE_CARD.md" ] && rclone copy "./RELEASE_CARD.md" gdrive: --drive-root-folder-id "$FOLDER_ID" -v
            if [ -d "shorts_out" ] && [ "$(ls -A shorts_out)" ]; then
              rclone copy "./shorts_out/" "gdrive:Shorts/" --drive-root-folder-id "$FOLDER_ID" -v
            fi
            DRIVE_LINK=$(rclone link "gdrive:$OUT_FILE" --drive-root-folder-id "$FOLDER_ID" 2>/dev/null || echo "")
          else
            rclone copy "./$OUT_FILE" gdrive:AetherFlow_Output/ \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
            [ -f "./$CHAPTERS_FILE" ] && rclone copy "./$CHAPTERS_FILE" gdrive:AetherFlow_Output/ -v
            [ -f "RELEASE_CARD.md" ] && rclone copy "./RELEASE_CARD.md" gdrive:AetherFlow_Output/ -v
            if [ -d "shorts_out" ] && [ "$(ls -A shorts_out)" ]; then
              rclone copy "./shorts_out/" "gdrive:AetherFlow_Output/Shorts/" -v
            fi
            DRIVE_LINK=$(rclone link "gdrive:AetherFlow_Output/$OUT_FILE" 2>/dev/null || echo "")
          fi

          FILE_SIZE=$(du -h "./$OUT_FILE" | cut -f1)
          QC_SUMMARY=$(jq -r '"\(.duration_formatted) • \(.integrated_lufs) LUFS"' qc_report.json 2>/dev/null || echo "OK")
          SHORTS_COUNT=$(ls -1 shorts_out/*.mp4 2>/dev/null | wc -l | tr -d ' ')
          echo "DRIVE_LINK=$DRIVE_LINK" >> $GITHUB_ENV
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "QC_SUMMARY=$QC_SUMMARY" >> $GITHUB_ENV
          echo "SHORTS_COUNT=$SHORTS_COUNT" >> $GITHUB_ENV

      - name: Send Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          END_TS=$(date +%s)
          ELAPSED=$((END_TS - START_TS))
          MINS=$((ELAPSED / 60))
          OUT_FILE=$(cat final_output_name.txt 2>/dev/null || echo "video.mp4")

          if [ "${{ github.event.inputs.preflight_only }}" = "true" ] && [ "$STATUS" = "success" ]; then
            MSG="🔍 *Preflight-проверка пройдена!*%0A%0A✅ Все исходные клипы и врезки найдены на Google Диске."
          elif [ "$STATUS" = "success" ]; then
            MSG="✅ *Мастер-ролик готов и прошёл Auto-QC!*%0A%0A📁 *Файл:* \`${OUT_FILE}\` (${FILE_SIZE})%0A🎛 *QC:* ${QC_SUMMARY}\%0A⏱ *Время сборки:* ${MINS} мин%0A📝 *Метаданные:* таймкоды и \`RELEASE_CARD.md\` в папке"
            [ "${SHORTS_COUNT:-0}" -gt 0 ] && MSG="${MSG}\%0A📱 *Shorts (9:16):* ${SHORTS_COUNT} шт. в подпапке \`Shorts/\`"
            [ -n "$DRIVE_LINK" ] && MSG="${MSG}\%0A🔗 [Открыть на Google Диске](${DRIVE_LINK})"
          else
            MSG="❌ *Ошибка при сборке проекта!*%0A%0A⚠️ *Статус:* $STATUS\%0A⏱ *Прошло:* ${MINS} мин"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=$MSG"
