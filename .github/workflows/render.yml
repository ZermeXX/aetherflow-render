name: 4K Ambience Seamless Render Engine

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'Параметры рендера в формате JSON (манифест из приложения)'
        required: true
        default: '{}'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # До 6 часов непрерывной работы бесплатного раннера GitHub

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Установка системных утилит (FFmpeg 7+, jq, rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq rclone curl ca-certificates

      - name: Парсинг параметров манифеста
        id: parse_manifest
        run: |
          echo '${{ github.event.inputs.manifest_json }}' > manifest.json
          cat manifest.json
          
          # Извлекаем параметры хронометража и ссылок
          DURATION_HOURS=$(jq -r '.duration_hours // 3' manifest.json)
          GDRIVE_FOLDER_ID=$(jq -r '.gdrive_folder_id' manifest.json)
          SHUFFLE_MODE=$(jq -r '.shuffle_mode // false' manifest.json)
          
          echo "DURATION_HOURS=$DURATION_HOURS" >> $GITHUB_ENV
          echo "GDRIVE_FOLDER_ID=$GDRIVE_FOLDER_ID" >> $GITHUB_ENV
          echo "SHUFFLE_MODE=$SHUFFLE_MODE" >> $GITHUB_ENV

      - name: Скачивание исходных медиафайлов (Видео + 3 слоя Аудио)
        run: |
          mkdir -p raw_scenes audio_layers output
          
          # Парсим и скачиваем видео-фрагменты сцен
          jq -r '.scenes[]?.video_url' manifest.json | while read -r url; do
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              curl -sL "$url" -o "raw_scenes/scene_$(date +%s%N).mp4"
            fi
          done
          
          # Скачиваем аудиодорожки (Слой 1: Музыка, Слой 2: Фоновый шум, Слой 3: SFX)
          MUSIC_URL=$(jq -r '.audio.music_url // empty' manifest.json)
          AMBIENCE_URL=$(jq -r '.audio.ambience_url // empty' manifest.json)
          SFX_URL=$(jq -r '.audio.sfx_url // empty' manifest.json)
          
          [ -n "$MUSIC_URL" ] && curl -sL "$MUSIC_URL" -o audio_layers/music.mp3 || touch audio_layers/music.mp3
          [ -n "$AMBIENCE_URL" ] && curl -sL "$AMBIENCE_URL" -o audio_layers/ambience.mp3 || touch audio_layers/ambience.mp3
          [ -n "$SFX_URL" ] && curl -sL "$SFX_URL" -o audio_layers/sfx.mp3 || touch audio_layers/sfx.mp3

      - name: Генерация бесшовного видеоцикла (Seamless Looping & Crossfade)
        run: |
          echo "Создание бесшовного базового видеофрагмента..."
          
          # Берем первое сгенерированное видео (или склеиваем сцены, если их несколько)
          FIRST_SCENE=$(ls raw_scenes/*.mp4 | head -n 1)
          
          # 1. Алгоритм Seamless Crossfade:
          # Берем исходный ролик, отрезаем последние 1.5 секунды и плавно накладываем их на самое начало.
          # В результате место склейки при зацикливании становится абсолютно незаметным.
          SCENE_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FIRST_SCENE")
          OFFSET=$(echo "$SCENE_DUR - 1.5" | bc -l)
          
          ffmpeg -y -i "$FIRST_SCENE" \
            -filter_complex "[0:v]split=2[v1][v2]; \
                             [v1]trim=start=1.5,setpts=PTS-STARTPTS[main]; \
                             [v2]trim=0:1.5,setpts=PTS-STARTPTS[head]; \
                             [main][head]xfade=transition=fade:duration=1.5:offset=$OFFSET[seamless]" \
            -map "[seamless]" -c:v libx264 -crf 17 -preset fast output/seamless_base.mp4

      - name: Микширование 3 аудио-слоев (Suno + Freesound + ElevenLabs SFX)
        run: |
          echo "Сведение звукового окружения..."
          
          VOL_MUSIC=$(jq -r '.audio.vol_music // "0.4"' manifest.json)
          VOL_AMB=$(jq -r '.audio.vol_ambience // "0.8"' manifest.json)
          VOL_SFX=$(jq -r '.audio.vol_sfx // "0.5"' manifest.json)
          
          # Сводим 3 слоя с индивидуальными уровнями громкости и мягким циклом
          ffmpeg -y \
            -stream_loop -1 -i audio_layers/music.mp3 \
            -stream_loop -1 -i audio_layers/ambience.mp3 \
            -stream_loop -1 -i audio_layers/sfx.mp3 \
            -filter_complex "[0:a]volume=${VOL_MUSIC}[a0]; \
                             [1:a]volume=${VOL_AMB}[a1]; \
                             [2:a]volume=${VOL_SFX}[a2]; \
                             [a0][a1][a2]amix=inputs=3:duration=longest:dropout_transition=3[aout]" \
            -map "[aout]" -c:a aac -b:a 320k output/mixed_audio.aac -t 60

      - name: Финальная сборка 4K мастер-файла на нужный хронометраж
        run: |
          TARGET_SECONDS=$(echo "${{ env.DURATION_HOURS }} * 3600" | bc)
          echo "Рендеринг финального фильма длительностью ${{ env.DURATION_HOURS }} ч. ($TARGET_SECONDS сек)..."
          
          # Зацикливаем бесшовный видеопоток и сведенный аудиопоток до целевой длины
          ffmpeg -y \
            -stream_loop -1 -i output/seamless_base.mp4 \
            -stream_loop -1 -i output/mixed_audio.aac \
            -t "$TARGET_SECONDS" \
            -c:v copy \
            -c:a copy \
            -movflags +faststart \
            output/final_ambience_${{ env.DURATION_HOURS }}h.mp4

      - name: Настройка авторизации Google Drive через Service Account / OAuth
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Выгрузка готового 4K фильма на Google Drive
        run: |
          echo "Загрузка фильма в Google Drive Workspace..."
          rclone copy output/final_ambience_${{ env.DURATION_HOURS }}h.mp4 "gdrive:__app_folder_id__" \
            --drive-root-folder-id "${{ env.GDRIVE_FOLDER_ID }}" \
            --progress --transfers 4 --checkers 8
          echo "✓ Фильм успешно загружен на ваш Google Drive!"
