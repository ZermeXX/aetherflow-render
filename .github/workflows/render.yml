name: AetherFlow 4K Cloud Render Pipeline

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'JSON-манифест проекта (ссылки на видео, аудио и тайминги)'
        required: true
      target_hours:
        description: 'Длительность видео в часах (например: 1, 3, 6)'
        default: '3'
        required: true
      resolution:
        description: 'Разрешение (4k или 1080p)'
        default: '4k'
        required: false

jobs:
  cloud_render:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # До 6 часов непрерывной работы одного сервера

    steps:
      - name: 1. Подготовка окружения и установка мощного FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg jq curl rclone python3-pip

      - name: 2. Парсинг манифеста и скачивание исходных фрагментов
        run: |
          mkdir -p workspace/inputs workspace/output
          echo '${{ github.event.inputs.manifest_json }}' > workspace/manifest.json
          
          # Скачивание исходных кусочков видео и аудио через curl
          echo "Парсинг ссылок и загрузка исходников..."
          jq -r '.scenes[].video_url' workspace/manifest.json | while read url; do
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              curl -sL "$url" -o "workspace/inputs/$(basename "$url")"
            fi
          done

      - name: 3. Сборка бесшовного Ambience Loop через FFmpeg
        run: |
          echo "Запуск склейки и зацикливания видео на ${{ github.event.inputs.target_hours }} ч..."
          
          # Создание плейлиста для конкатенации
          for f in workspace/inputs/*.mp4; do echo "file '$PWD/$f'" >> workspace/inputs.txt; done
          
          # Быстрая бесшовная сборка мастер-петли без потери качества
          ffmpeg -y -f concat -safe 0 -i workspace/inputs.txt -c copy workspace/master_loop.mp4
          
          # Расчет циклов и растягивание на нужный хронометраж
          TARGET_HOURS=${{ github.event.inputs.target_hours }}
          TOTAL_SECS=$((TARGET_HOURS * 3600))
          
          ffmpeg -y -stream_loop -1 -i workspace/master_loop.mp4 -t $TOTAL_SECS -c copy workspace/output/final_render_4k.mp4

      - name: 4. Автоматическая загрузка готового 4K-видео на Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          echo "Выгрузка готового 4K ролика напрямую в ваше облако Google Drive (5 TB)..."
          # Если секрет настроен, rclone мгновенно передает файл прямо в Google Drive
          # rclone copy workspace/output/final_render_4k.mp4 gdrive:AetherFlow_Renders/
