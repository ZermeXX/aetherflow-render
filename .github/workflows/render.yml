name: AetherFlow 4K Cloud Renderer (FFmpeg + Google Drive)

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'Complete pipeline manifest JSON (escaped or base64)'
        required: false
        default: '{}'
        type: string
      resolution:
        description: 'Render resolution (e.g. 3840x2160 for 4K UHD)'
        required: false
        default: '3840x2160'
        type: string
      duration_minutes:
        description: 'Target loop duration in minutes'
        required: false
        default: '60'
        type: string

jobs:
  render_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install High-Performance FFmpeg, jq & rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq rclone curl bc python3 ca-certificates

      - name: Parse Manifest & Download Scene Media Assets
        run: |
          echo "Decoding and writing manifest.json..."
          echo '${{ inputs.manifest_json }}' > manifest.json
          cat manifest.json
          
          mkdir -p raw_scenes audio_layers output
          
          # Парсим и скачиваем видео-фрагменты сцен
          jq -r '.scenes[]?.video_url' manifest.json | while read -r url; do
            if [ -n "$url" ] && [ "$url" != "null" ]; then
              curl -sL "$url" -o "raw_scenes/scene_$(date +%s%N).mp4"
            fi
          done
          
          # Скачиваем дорожки аудиомикшера
          MUSIC_URL=$(jq -r '.audio.music_url // empty' manifest.json)
          AMBIENCE_URL=$(jq -r '.audio.ambience_url // empty' manifest.json)
          SFX_URL=$(jq -r '.audio.sfx_url // empty' manifest.json)
          
          [ -n "$MUSIC_URL" ] && curl -sL "$MUSIC_URL" -o audio_layers/music.mp3 || touch audio_layers/music.mp3
          [ -n "$AMBIENCE_URL" ] && curl -sL "$AMBIENCE_URL" -o audio_layers/ambience.mp3 || touch audio_layers/ambience.mp3
          [ -n "$SFX_URL" ] && curl -sL "$SFX_URL" -o audio_layers/sfx.mp3 || touch audio_layers/sfx.mp3

      - name: Assemble 4K Master Video with Seamless XFade & Audio Normalization
        run: |
          echo "Executing FFmpeg 4K Master Assembly..."
          
          # Проверяем наличие скачанных сцен; если пусто — создаем тестовый фон под выбранное разрешение
          FIRST_SCENE=$(ls raw_scenes/*.mp4 2>/dev/null | head -n 1)
          
          if [ -n "$FIRST_SCENE" ]; then
            echo "Processing video asset: $FIRST_SCENE"
            SCENE_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$FIRST_SCENE")
            OFFSET=$(echo "$SCENE_DUR - 1.5" | bc -l)
            
            # Круговой кроссфейд для бесшовного зацикливания
            ffmpeg -y -i "$FIRST_SCENE" \
              -filter_complex "[0:v]split=2[v1][v2]; \
                               [v1]trim=start=1.5,setpts=PTS-STARTPTS[main]; \
                               [v2]trim=0:1.5,setpts=PTS-STARTPTS[head]; \
                               [main][head]xfade=transition=fade:duration=1.5:offset=$OFFSET[seamless]" \
              -map "[seamless]" -c:v libx264 -crf 17 -preset fast output/base_video.mp4
          else
            echo "No scene URL found, generating ultra-high bitrate test canvas..."
            ffmpeg -y -f lavfi -i color=c=0x08090C:s=${{ inputs.resolution }}:r=60 -t 10 -c:v libx264 -preset veryfast -crf 18 output/base_video.mp4
          fi

          # Сведение 3 аудио-слоев
          VOL_MUSIC=$(jq -r '.audio.vol_music // "0.4"' manifest.json)
          VOL_AMB=$(jq -r '.audio.vol_ambience // "0.8"' manifest.json)
          VOL_SFX=$(jq -r '.audio.vol_sfx // "0.5"' manifest.json)
          
          ffmpeg -y \
            -stream_loop -1 -i audio_layers/music.mp3 \
            -stream_loop -1 -i audio_layers/ambience.mp3 \
            -stream_loop -1 -i audio_layers/sfx.mp3 \
            -filter_complex "[0:a]volume=${VOL_MUSIC}[a0]; \
                             [1:a]volume=${VOL_AMB}[a1]; \
                             [2:a]volume=${VOL_SFX}[a2]; \
                             [a0][a1][a2]amix=inputs=3:duration=longest:dropout_transition=3[aout]" \
            -map "[aout]" -c:a aac -b:a 320k output/mixed_audio.aac -t 60

          # Финальная сборка на требуемый хронометраж (в минутах)
          TARGET_SECONDS=$(echo "${{ inputs.duration_minutes }} * 60" | bc)
          echo "Rendering final target duration: $TARGET_SECONDS seconds..."
          
          ffmpeg -y \
            -stream_loop -1 -i output/base_video.mp4 \
            -stream_loop -1 -i output/mixed_audio.aac \
            -t "$TARGET_SECONDS" \
            -c:v copy \
            -c:a copy \
            -movflags +faststart \
            aetherflow_master_4k.mp4

      - name: Upload Master Video to Google Drive (5 TB Storage Tier)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONFIG }}
        run: |
          echo "Configuring rclone credentials..."
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          
          GDRIVE_FOLDER_ID=$(jq -r '.gdrive_folder_id // empty' manifest.json)
          
          echo "Uploading aetherflow_master_4k.mp4 to Google Drive..."
          if [ -n "$GDRIVE_FOLDER_ID" ]; then
            rclone copy aetherflow_master_4k.mp4 "gdrive:" --drive-root-folder-id "$GDRIVE_FOLDER_ID" --progress
          else
            rclone copy aetherflow_master_4k.mp4 "gdrive:AetherFlow_Cinema/" --progress
          fi
          echo "✓ Successfully uploaded to Google Drive!"

      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetherflow-master-4k
          path: aetherflow_master_4k.mp4
