name: AetherFlow 4K Render Pipeline
on:
  workflow_dispatch:
    inputs:
      manifest_payload:
        description: 'Base64 or raw JSON manifest payload from AetherCombine Studio'
        required: false
        default: ''
      manifest_gdrive_file:
        description: 'Optional manifest JSON filename on Google Drive (fallback if payload omitted)'
        required: false
        default: 'manifest.json'
      preflight_only:
        description: 'Run asset preflight verification only'
        required: false
        default: 'false'
permissions:
  contents: read
env:
  PYTHONUNBUFFERED: '1'
  AETHER_BUDGET_MINUTES: '330'
jobs:
  render:
    name: render
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Record Start Time
        id: timer
        run: echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h
      - name: Install FFmpeg, Fonts, Pillow & Rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation unzip curl
          python3 -m pip install --quiet --upgrade pip pillow
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          ffmpeg -version | head -n 2
          rclone version | head -n 2
      - name: Validate Renderer and Dependencies
        run: |
          python3 -m py_compile assemble_scenes.py lower_third_overlay.py
          python3 -c 'import PIL; import lower_third_overlay'
          ffprobe -version > /dev/null
          ffmpeg -hide_banner -encoders > /tmp/aether-encoders.txt
          grep -q libx264 /tmp/aether-encoders.txt
          ffmpeg -hide_banner -filters > /tmp/aether-filters.txt
          for filter in zoompan overlay loudnorm alimiter fade; do
            grep -wq "$filter" /tmp/aether-filters.txt
          done
      - name: Setup Personal Rclone Config
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_B64" ]; then
            if echo "$RCLONE_CONFIG_B64" | grep -q "\[gdrive\]"; then
              printf "%s\n" "$RCLONE_CONFIG_B64" > ~/.config/rclone/rclone.conf
            else
              echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf
            fi
          elif [ -n "$GDRIVE_SA_JSON" ]; then
            printf "%s\n" "$GDRIVE_SA_JSON" > ~/.config/rclone/sa.json
            cat << 'EOF' > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /home/runner/.config/rclone/sa.json
          EOF
          else
            echo "::error::Missing RCLONE_CONFIG or GDRIVE_SERVICE_ACCOUNT_JSON secret"
            exit 1
          fi
          chmod 600 ~/.config/rclone/rclone.conf
      - name: Parse and Sanitize Studio Manifest Payload
        env:
          RAW_PAYLOAD: ${{ github.event.inputs.manifest_payload }}
          MANIFEST_GDRIVE_FILE: ${{ github.event.inputs.manifest_gdrive_file }}
          DEFAULT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 - << 'PY'
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path
          SECRET_KEYS = {
              "bot_token", "chat_id", "service_account", "sa_json", "pat", "github_token",
              "access_token", "refresh_token", "client_secret", "api_key", "token",
              "telegram_bot_token", "telegram_chat_id"
          }
          def normalize(o):
              if isinstance(o, dict):
                  return {(k.strip() if isinstance(k, str) else k): normalize(v) for k, v in o.items()}
              if isinstance(o, list):
                  return [normalize(v) for v in o]
              if isinstance(o, str):
                  return o.strip()
              return o
          def scrub(o):
              if isinstance(o, dict):
                  return {k: scrub(v) for k, v in o.items() if k.lower() not in SECRET_KEYS}
              if isinstance(o, list):
                  return [scrub(v) for v in o]
              return o
          raw = (os.environ.get("RAW_PAYLOAD") or "").strip()
          manifest_data = None
          if raw:
              try:
                  manifest_data = json.loads(raw)
              except Exception:
                  decoded = base64.b64decode(raw).decode("utf-8")
                  manifest_data = json.loads(decoded)
          else:
              fallback_name = (os.environ.get("MANIFEST_GDRIVE_FILE") or "manifest.json").strip()
              folder_id = (os.environ.get("DEFAULT_FOLDER_ID") or "").strip()
              cmd = ["rclone", "copyto", f"gdrive:{fallback_name}", "manifest.json"]
              if folder_id:
                  cmd += ["--drive-root-folder-id", folder_id]
              subprocess.run(cmd, check=True)
              manifest_data = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          if not isinstance(manifest_data, dict):
              raise SystemExit("[MANIFEST] Expected JSON object")
          clean_manifest = scrub(normalize(manifest_data))
          import re
          project = clean_manifest.get("project_name")
          if not isinstance(project, str) or not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_. -]{0,159}", project):
              raise SystemExit("[MANIFEST] Invalid project_name")
          scenes = clean_manifest.get("timeline") or clean_manifest.get("scenes")
          if not isinstance(scenes, list) or not scenes or not all(isinstance(e, dict) for e in scenes):
              raise SystemExit("[MANIFEST] Expected nonempty scene list")
          if not clean_manifest.get("gdrive_folder_id"):
              cloud_id = (clean_manifest.get("cloud_export") or {}).get("target_folder_id")
              default_id = (os.environ.get("DEFAULT_FOLDER_ID") or "").strip()
              resolved_id = str(cloud_id or default_id).strip()
              if resolved_id:
                  clean_manifest["gdrive_folder_id"] = resolved_id
          Path("manifest.json").write_text(
              json.dumps(clean_manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          Path("current_manifest.json").write_text(
              json.dumps(clean_manifest, ensure_ascii=False, indent=2), encoding="utf-8")
          scenes = clean_manifest.get("timeline") or clean_manifest.get("scenes") or []
          print(f"[MANIFEST] Project={clean_manifest.get('project_name')} | Scenes={len(scenes)}")
          PY
      - name: Preflight Asset Check
        run: |
          python3 assemble_scenes.py manifest.json --assets-dir assets --preflight
      - name: Assemble Scenes with FFmpeg
        if: ${{ github.event.inputs.preflight_only != 'true' }}
        run: |
          python3 assemble_scenes.py manifest.json --assets-dir assets
      - name: Run Auto-QC, SRT, Chapters, Shorts & Release Card
        if: ${{ github.event.inputs.preflight_only != 'true' }}
        run: |
          python3 - << 'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          project_name = str(manifest.get("project_name") or "output").strip()
          out_dir = Path("output")
          out_dir.mkdir(parents=True, exist_ok=True)
          final_video = out_dir / f"{project_name}.mp4"
          if not final_video.is_file():
              raise SystemExit(f"[AUTO-QC] Output video not found: {final_video}")
          chapters = manifest.get("chapters_youtube") or []
          chapters_lines = []
          existing_chapters = out_dir / "output_chapters.txt"
          if not chapters and existing_chapters.is_file() and existing_chapters.read_text(encoding="utf-8").strip():
              chapters_lines = [l for l in existing_chapters.read_text(encoding="utf-8").splitlines() if l.strip()]
          elif isinstance(chapters, str):
              chapters_lines = [l.strip() for l in chapters.splitlines() if l.strip()]
          elif isinstance(chapters, list):
              for ch in chapters:
                  if isinstance(ch, dict):
                      tc = str(ch.get("timecode") or ch.get("start_time") or "00:00").strip()
                      title = str(ch.get("title") or f"Scene {ch.get('scene_index', '')}").strip()
                      chapters_lines.append(f"{tc} {title}")
                  elif isinstance(ch, str) and ch.strip():
                      chapters_lines.append(ch.strip())
          if not chapters_lines:
              chapters_lines = ["00:00 Intro"]
          existing_chapters.write_text("\n".join(chapters_lines) + "\n", encoding="utf-8")
          probe_res = subprocess.run(
              ["ffprobe", "-v", "error", "-print_format", "json", "-show_format", "-show_streams", str(final_video)],
              capture_output=True, text=True, check=True
          )
          pdata = json.loads(probe_res.stdout)
          dur_sec = float((pdata.get("format") or {}).get("duration", 0) or 0)
          streams = pdata.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
          if not video or not audio or dur_sec <= 0:
              raise SystemExit("[AUTO-QC] Missing video/audio or invalid duration")
          preview = out_dir / f"{project_name}_720p_preview.mp4"
          if not preview.is_file():
              raise SystemExit("[AUTO-QC] Missing preview")
          preview_duration = float(subprocess.check_output(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-of", "default=noprint_wrappers=1:nokey=1", str(preview)], text=True))
          limit = float((manifest.get("export_settings") or {}).get("preview_duration_sec") or 0)
          expected_preview = min(dur_sec, limit) if limit > 0 else dur_sec
          if abs(preview_duration - expected_preview) > 0.25:
              raise SystemExit("[AUTO-QC] Preview duration mismatch")
          size_mb = round(final_video.stat().st_size / (1024 * 1024), 2)
          qc_path = Path("qc_report.json")
          qc = json.loads(qc_path.read_text(encoding="utf-8")) if qc_path.is_file() else {}
          qc["verified_duration_sec"] = round(dur_sec, 3)
          qc["preview_duration_sec"] = round(preview_duration, 3)
          qc["video_resolution"] = [video.get("width"), video.get("height")]
          qc["video_fps"] = video.get("avg_frame_rate")
          qc["audio_codec"] = audio.get("codec_name")
          qc["file_size_mb"] = size_mb
          qc["chapters_count"] = len(chapters_lines)
          qc_path.write_text(json.dumps(qc, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"[AUTO-QC] Verified {final_video.name}: {dur_sec:.2f}s | {size_mb} MB | {len(chapters_lines)} chapters")
          PY
      - name: Upload Output Video, Shorts & Metadata to Google Drive
        if: ${{ github.event.inputs.preflight_only != 'true' }}
        env:
          DEFAULT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -eu
          PROJECT_NAME=$(python3 -c 'import json; print(json.load(open("manifest.json"))["project_name"])')
          FOLDER_ID=$(python3 -c 'import json, os; m=json.load(open("manifest.json")); print((m.get("gdrive_folder_id") or (m.get("cloud_export") or {}).get("target_folder_id") or os.environ.get("DEFAULT_FOLDER_ID", "")).strip())')
          DEST_DIR="gdrive:_RENDER_OUTPUT_${PROJECT_NAME}"
          ROOT_ARGS=()
          if [ -n "$FOLDER_ID" ]; then ROOT_ARGS=(--drive-root-folder-id "$FOLDER_ID"); fi
          # Pacing против Google anti-bot троттлинга: 1 transfer, лимит tps, крупный chunk.
          PACE=(--transfers 1 --checkers 2 --tpslimit 4 --tpslimit-burst 4
                --drive-chunk-size 256M --drive-upload-cutoff 256M
                --timeout 10m --contimeout 60s
                --retries 5 --retries-sleep 20s --low-level-retries 10
                --stats-one-line)
          upload() {  # upload <local-file> <required:1|0>
            local src="$1" required="$2" attempt=1 max=4
            if [ ! -f "$src" ]; then
              if [ "$required" = "1" ]; then
                echo "::error::Required file missing: $src"
                return 1
              fi
              return 0
            fi
            while [ "$attempt" -le "$max" ]; do
              if rclone copy "$src" "$DEST_DIR/" "${ROOT_ARGS[@]}" "${PACE[@]}"; then
                echo "[UPLOAD] OK: $src"
                return 0
              fi
              echo "[UPLOAD] attempt $attempt failed for $src (Google rate-limit?); sleep $((attempt*30))s"
              sleep $((attempt*30))
              attempt=$((attempt+1))
            done
            if [ "$required" = "1" ]; then
              echo "::error::Required upload failed after retries: $src"
              return 1
            fi
            echo "[UPLOAD] WARN: optional metadata not uploaded (non-fatal): $src"
            return 0
          }
          upload "output/${PROJECT_NAME}.mp4" 1
          upload "output/${PROJECT_NAME}_720p_preview.mp4" 1
          upload "output/${PROJECT_NAME}_EN.srt" 0
          upload "output/${PROJECT_NAME}_RU.srt" 0
          upload "output/output_chapters.txt" 0
          upload "output/RELEASE_CARD.md" 0
          upload "qc_report.json" 0
          echo "✅ Upload finished: $DEST_DIR"
      - name: Upload QC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-qc-report-${{ github.run_number }}
          if-no-files-found: ignore
          path: |
            qc_report.json
            build/actual_timings.json
            output/output_chapters.txt
            output/RELEASE_CARD.md
      - name: Send Telegram Notification
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - << 'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          bot = (os.environ.get("TG_BOT_TOKEN") or "").strip()
          chat = (os.environ.get("TG_CHAT_ID") or "").strip()
          if not bot or not chat:
              print("[TG] Telegram secrets not set, skipping.")
              raise SystemExit(0)
          project = "AetherFlow"
          if Path("manifest.json").is_file():
              project = json.loads(Path("manifest.json").read_text(encoding="utf-8")).get("project_name", project)
          status = "${{ job.status }}"
          run_url = "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          qc_info = ""
          if Path("qc_report.json").is_file():
              qc = json.loads(Path("qc_report.json").read_text(encoding="utf-8"))
              qc_info = f"\n⏱ Длительность: {qc.get('duration_formatted', '?')} | 📦 Размер: {qc.get('file_size_mb', '?')} MB | 🎬 Сцен: {qc.get('scenes', '?')}"
          icon = "✅" if status == "success" else "❌"
          msg = f"{icon} AetherFlow Render ({status}) для {project}.{qc_info}\n🔗 {run_url}"
          payload = json.dumps({"chat_id": chat, "text": msg}).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot}/sendMessage",
              data=payload, headers={"Content-Type": "application/json"}, method="POST")
          try:
              urllib.request.urlopen(req, timeout=15)
          except Exception as e:
              print(f"[TG] Warning: {e}")
          PY
