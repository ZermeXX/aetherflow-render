name: Render Scenes Pipeline

on:
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Разрешение рендера (4k / 1080p)'
        required: false
        default: '4k'

jobs:
  render_scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies (FFmpeg & Rclone)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq
          curl https://rclone.org/install.sh | sudo bash

      - name: Build and Run FFmpeg Pipeline
        run: |
          set -e
          mkdir -p temp_scenes output_dir

          echo "=== Сборка сюжетных сцен из манифеста ==="
          if [ -f "render_scenes.sh" ]; then
            bash render_scenes.sh
          elif [ -f "scenes_list.txt" ]; then
            # Склейка готового списка сцен
            ffmpeg -y -f concat -safe 0 -i scenes_list.txt -c:v libx264 -preset fast -crf 20 -c:a aac -b:a 320k output.mp4
          elif [ -f "manifest.json" ]; then
            echo "Обнаружен manifest.json, запуск универсального парсера сцен..."
            python3 build_scenes.py || bash render_from_manifest.sh
          else
            echo "Входные сцены не обнаружены. Генерация тестового сюжетного ролика..."
            ffmpeg -y -f lavfi -i color=c=navy:s=3840x2160:r=24 -f lavfi -i anullsrc=r=48000:cl=stereo -t 60 -c:v libx264 -preset fast -crf 20 -c:a aac output.mp4
          fi

          echo "Проверка скомпилированного видео:"
          ls -lh output.mp4

      - name: Setup Personal Rclone Config
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Upload Output Video to Google Drive
        run: |
          echo "=== Выгрузка сюжетного ролика на Google Диск ==="
          rclone copy ./output.mp4 gdrive:AetherFlow_Output/ \
            --drive-chunk-size 64M \
            --transfers 2 \
            --checkers 4 \
            --retries 5 \
            --low-level-retries 10 \
            --stats 30s \
            -v

      - name: Send Telegram Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            MSG="🎬 *Сюжетный ролик (Scenes) успешно готов!*%0A%0A📁 *Файл:* output.mp4%0A☁️ *Папка:* Google Drive / AetherFlow_Output%0A✨ *Статус:* Доступен для загрузки"
          else
            MSG="❌ *Ошибка сборки сюжетных сцен!*%0A%0A⚠️ *Статус:* ${{ job.status }}%0A🔍 Проверьте лог шага FFmpeg Pipeline."
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=$MSG"
