name: AetherFlow 4K Render Pipeline
on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'Compact JSON manifest from AETHER COMBINE studio'
        required: false
        type: string
        default: ''
      manifest_payload:
        description: 'Alternative manifest payload key'
        required: false
        type: string
        default: ''
      manifest:
        description: 'Legacy manifest key'
        required: false
        type: string
        default: ''
      gdrive_folder_id:
        description: 'Google Drive folder ID with scene assets'
        required: false
        type: string
        default: ''
      folder_id:
        description: 'Alternative Google Drive folder ID key'
        required: false
        type: string
        default: ''
      project_name:
        description: 'Optional project name override'
        required: false
        type: string
        default: ''
      preflight_only:
        description: 'Run asset preflight verification only'
        required: false
        type: string
        default: 'false'
permissions:
  contents: read
concurrency:
  group: render-scenes-${{ github.ref }}
  cancel-in-progress: false
env:
  GDRIVE_REMOTE: gdrive
  MANIFEST_PATH: manifest.json
  PYTHONUNBUFFERED: '1'
  AETHER_BUDGET_MINUTES: '330'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Record Start Time
        run: echo "START_TS=$(date +%s)" >> $GITHUB_ENV
      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h
      - name: Install FFmpeg, Fonts, Pillow & Rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl unzip jq fonts-dejavu-core python3 python3-pil
          if ! command -v rclone &> /dev/null; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          python3 -c "import PIL; print('Pillow', PIL.__version__)"
          ffmpeg -version | head -n 1
          rclone version | head -n 1
      - name: Setup Personal Rclone Config
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          RCLONE_CONF_RAW: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONF_B64" ]; then
            if printf "%s" "$RCLONE_CONF_B64" | grep -q "\[gdrive\]"; then
              printf "%s\n" "$RCLONE_CONF_B64" > ~/.config/rclone/rclone.conf
            else
              echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
            fi
          elif [ -n "$RCLONE_CONF_RAW" ]; then
            if printf "%s" "$RCLONE_CONF_RAW" | grep -q "\[gdrive\]"; then
              printf "%s\n" "$RCLONE_CONF_RAW" > ~/.config/rclone/rclone.conf
            else
              echo "$RCLONE_CONF_RAW" | base64 -d > ~/.config/rclone/rclone.conf
            fi
          else
            echo "❌ Не найден секрет RCLONE_CONFIG_BASE64 или RCLONE_CONFIG!" >&2
            exit 1
          fi
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes
      - name: Parse and Sanitize Studio Manifest Payload
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
          SECRET_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 - << 'EOF'
          import base64, gzip, json, os, re, subprocess
          from pathlib import Path

          SECRET_KEYS = {"bot_token", "chat_id", "service_account", "sa_json", "pat", "github_token",
                         "access_token", "refresh_token", "client_secret", "api_key", "token",
                         "telegram_bot_token", "telegram_chat_id"}

          def scrub(o):
              if isinstance(o, dict):
                  return {k: scrub(v) for k, v in o.items() if k.lower() not in SECRET_KEYS}
              if isinstance(o, list):
                  return [scrub(v) for v in o]
              return o

          def normalize(o):
              if isinstance(o, dict):
                  return {(k.strip() if isinstance(k, str) else k): normalize(v) for k, v in o.items()}
              if isinstance(o, list):
                  return [normalize(v) for v in o]
              if isinstance(o, str):
                  return o.strip()
              return o

          def safe_name(value, fallback="output"):
              cleaned = re.sub(r"[^A-Za-z0-9._-]+", "_", str(value or "")).strip("._-")
              return cleaned or fallback

          def safe_id(value):
              return re.sub(r"[^A-Za-z0-9_-]+", "", str(value or "")).strip()

          inputs = json.loads(os.environ.get("INPUTS_JSON") or "{}")
          print("📥 Полученные ключи inputs:", list(inputs.keys()))
          raw_candidate = ""
          for key in ("manifest_json", "manifest_payload", "manifest", "manifest_b64", "payload"):
              val = inputs.get(key)
              if isinstance(val, str) and val.strip():
                  raw_candidate = val.strip()
                  print(f"✅ Найден payload в поле inputs.{key} (длина: {len(raw_candidate)} симв.)")
                  break
          if not raw_candidate:
              for key, val in inputs.items():
                  if key == "preflight_only":
                      continue
                  if isinstance(val, str) and (val.strip().startswith("{") or val.strip().startswith("gz:") or len(val.strip()) > 200):
                      raw_candidate = val.strip()
                      print(f"✅ Найден payload в поле inputs.{key}")
                      break

          manifest_data = None
          if raw_candidate:
              decoded = raw_candidate
              if decoded.startswith("gz:"):
                  decoded = gzip.decompress(base64.b64decode(decoded[3:])).decode("utf-8")
              elif not decoded.startswith("{"):
                  try:
                      decoded = base64.b64decode(decoded).decode("utf-8")
                  except Exception:
                      pass
              manifest_data = json.loads(decoded)

          folder_id = safe_id(
              (inputs.get("gdrive_folder_id") or "").strip()
              or (inputs.get("folder_id") or "").strip()
              or str((manifest_data or {}).get("gdrive_folder_id", "")).strip()
              or str((manifest_data or {}).get("folder_id", "")).strip()
              or os.environ.get("SECRET_FOLDER_ID", "").strip()
          )

          if not manifest_data and folder_id:
              remote = os.environ.get("GDRIVE_REMOTE", "gdrive")
              print("🔍 Ищем *manifest*.json на Google Drive...")
              res = subprocess.run(
                  ["rclone", "lsf", f"{remote}:", "--files-only", "--include", "*manifest*.json",
                   "--drive-root-folder-id", folder_id],
                  capture_output=True, text=True, check=True,
              )
              files = sorted([line.strip() for line in res.stdout.splitlines() if line.strip()])
              if files:
                  subprocess.run(
                      ["rclone", "copyto", f"{remote}:{files[-1]}", "manifest.json",
                       "--drive-root-folder-id", folder_id],
                      check=True,
                  )
                  manifest_data = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
                  print(f"✅ Скачан манифест с Google Drive: {files[-1]}")

          if not manifest_data or not isinstance(manifest_data, dict):
              raise RuntimeError("Failed to obtain non-empty manifest.json for scene assembly!")

          manifest_data = scrub(normalize(manifest_data))
          if not folder_id:
              folder_id = safe_id(
                  manifest_data.get("gdrive_folder_id")
                  or (manifest_data.get("cloud_export") or {}).get("target_folder_id")
                  or os.environ.get("SECRET_FOLDER_ID", "")
              )
          if folder_id:
              manifest_data["gdrive_folder_id"] = folder_id
          project_override = (inputs.get("project_name") or "").strip()
          if project_override:
              manifest_data["project_name"] = project_override
          manifest_data["project_name"] = safe_name(manifest_data.get("project_name"), "output")
          if manifest_data["project_name"].lower().endswith(".mp4"):
              manifest_data["project_name"] = manifest_data["project_name"][:-4]

          payload = json.dumps(manifest_data, ensure_ascii=False, indent=2)
          Path("manifest.json").write_text(payload, encoding="utf-8")
          Path("current_manifest.json").write_text(payload, encoding="utf-8")
          scenes = manifest_data.get("timeline") or manifest_data.get("scenes") or []
          if not scenes:
              raise RuntimeError("P0-GUARD: манифест не содержит сцен (timeline / scenes пуст).")
          print(f"✅ manifest.json сохранён, ключи нормализованы, секреты удалены ({len(scenes)} сцен)")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as env_f:
                  env_f.write(f"EFFECTIVE_FOLDER_ID={folder_id}\n")
                  env_f.write(f"PROJECT_NAME={manifest_data['project_name']}\n")
          EOF
      - name: Preflight Asset Check
        env:
          SECRET_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_FOLDER_ID: ${{ env.EFFECTIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -e
          mkdir -p assets output
          python3 assemble_scenes.py manifest.json --assets-dir assets --preflight
      - name: Assemble Scenes with FFmpeg
        if: ${{ github.event.inputs.preflight_only != 'true' }}
        env:
          GDRIVE_FOLDER_ID: ${{ env.EFFECTIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -e
          mkdir -p assets output
          python3 assemble_scenes.py manifest.json --assets-dir assets
      - name: Run Auto-QC, SRT, Chapters, Shorts & Release Card
        if: ${{ github.event.inputs.preflight_only != 'true' }}
        run: |
          python3 - << 'EOF'
          import json, subprocess
          from pathlib import Path

          def to_bool(val, default=True):
              if isinstance(val, bool):
                  return val
              if isinstance(val, (int, float)):
                  return bool(val)
              if isinstance(val, str):
                  v = val.strip().lower()
                  if v in {"false", "0", "no", "off", "disabled", ""}:
                      return False
                  if v in {"true", "1", "yes", "on", "enabled"}:
                      return True
              return default

          def fmt_chapter_time(sec: float) -> str:
              total_s = max(0, int(round(sec)))
              h, rem = divmod(total_s, 3600)
              m, s = divmod(rem, 60)
              return f"{h:02d}:{m:02d}:{s:02d}" if h > 0 else f"{m:02d}:{s:02d}"

          def fmt_srt_time(sec: float) -> str:
              ms = int(round(max(0.0, sec) * 1000))
              h, rem = divmod(ms, 3600000)
              m, rem = divmod(rem, 60000)
              s, ms = divmod(rem, 1000)
              return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          project_name = manifest.get("project_name", "output")
          video_title = manifest.get("video_title", project_name)
          out_dir = Path("output")
          out_dir.mkdir(parents=True, exist_ok=True)

          candidates = [out_dir / f"{project_name}.mp4", out_dir / project_name]
          main_video = next((p for p in candidates if p.is_file()), None)
          if main_video is None:
              vids = [p for p in sorted(out_dir.glob("*.mp4")) if "preview" not in p.name.lower()]
              main_video = vids[0] if vids else None
          if main_video is None or main_video.stat().st_size < 10000:
              raise RuntimeError(f"Auto-QC failed: итоговый видеофайл отсутствует или повреждён ({project_name}.mp4)")

          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries",
               "format=duration,size:stream=codec_type,codec_name,width,height,r_frame_rate",
               "-of", "json", str(main_video)],
              capture_output=True, text=True, check=True,
          )
          qc_info = json.loads(probe.stdout)
          duration_sec = float(qc_info["format"]["duration"])
          size_mb = int(qc_info["format"]["size"]) / (1024 * 1024)
          vstream = next((s for s in qc_info.get("streams", []) if s.get("codec_type") == "video"), {})
          astream = next((s for s in qc_info.get("streams", []) if s.get("codec_type") == "audio"), None)
          if not vstream or astream is None:
              raise RuntimeError("Auto-QC failed: в мастере нет видео- или аудио-дорожки!")
          width = vstream.get("width", 0)
          height = vstream.get("height", 0)
          try:
              num, den = str(vstream.get("r_frame_rate", "0/1")).split("/")
              fps_real = round(float(num) / float(den), 3) if float(den) else 0
          except Exception:
              fps_real = 0
          print(f"✅ Auto-QC passed: {main_video.name} | {duration_sec:.2f}s | {size_mb:.1f} MB | {width}x{height}@{fps_real}")

          qc_path = Path("qc_report.json")
          qc = json.loads(qc_path.read_text(encoding="utf-8")) if qc_path.is_file() else {}
          qc.update({
              "status": "PASS", "file": main_video.name,
              "verified_duration_sec": round(duration_sec, 3),
              "duration_sec": qc.get("duration_sec", round(duration_sec, 2)),
              "duration_formatted": fmt_chapter_time(duration_sec),
              "file_size_mb": round(size_mb, 2), "size_mb": round(size_mb, 1),
              "width": width, "height": height, "fps": fps_real,
              "integrated_lufs": qc.get("integrated_lufs", -14.0),
              "has_video": True, "has_audio": True,
          })
          Path("final_output_name.txt").write_text(main_video.name, encoding="utf-8")

          timings_path = Path("build/actual_timings.json")
          actual_timings = json.loads(timings_path.read_text(encoding="utf-8")) if timings_path.is_file() else []
          if not actual_timings:
              print("⚠️ build/actual_timings.json отсутствует — таймкоды берутся из манифеста.")
          ui_montage = (manifest.get("studio_ui_presets") or {}).get("tab_1_montage") or {}
          render_cfg = manifest.get("render_settings") or {}

          sub_cfg = (manifest.get("subtitles_export") or manifest.get("subtitles_settings")
                     or ui_montage.get("subtitles_export") or render_cfg.get("subtitles") or {})
          raw_sub_flag = (sub_cfg.get("enabled") if isinstance(sub_cfg, dict) and "enabled" in sub_cfg
                          else manifest.get("export_subtitles", ui_montage.get("export_subtitles", render_cfg.get("export_subtitles", True))))
          subtitles_enabled = to_bool(raw_sub_flag, default=True)
          selected_langs = ((sub_cfg.get("languages") if isinstance(sub_cfg, dict) else None)
                            or manifest.get("subtitle_languages") or ui_montage.get("subtitle_languages")
                            or ["en", "ru"])
          langs = [str(l).strip().lower() for l in selected_langs if str(l).strip()]
          scenes = manifest.get("timeline") or manifest.get("scenes") or []
          created_srts = [p.name for p in sorted(out_dir.glob("*.srt"))]
          if subtitles_enabled and langs:
              for lang in langs:
                  srt_lines, cur_t, idx_sub = [], 0.0, 1
                  for idx_sc, sc in enumerate(scenes):
                      if idx_sc < len(actual_timings):
                          st = float(actual_timings[idx_sc]["voice_start"])
                          en = float(actual_timings[idx_sc]["scene_end"])
                      else:
                          dur = float(sc.get("duration_sec") or sc.get("duration") or 10.0)
                          st, en = cur_t, cur_t + dur
                          cur_t = en
                      subs = sc.get("subtitles") or {}
                      text = str(subs.get(lang) or subs.get(lang.upper()) or "").strip()
                      if text and en > st:
                          srt_lines.append(f"{idx_sub}\n{fmt_srt_time(st)} --> {fmt_srt_time(en)}\n{text}\n")
                          idx_sub += 1
                  if srt_lines:
                      srt_file = out_dir / f"{project_name}_{lang.upper()}.srt"
                      srt_file.write_text("\n".join(srt_lines), encoding="utf-8")
                      if srt_file.name not in created_srts:
                          created_srts.append(srt_file.name)
              print(f"✅ SRT subtitles: {', '.join(created_srts) if created_srts else 'none'}")
          else:
              print("⏭️ SRT export disabled by manifest — сохраняем уже созданные файлы.")

          chapters = manifest.get("chapters_youtube") or []
          chapters_lines = []
          existing_chapters = out_dir / "output_chapters.txt"
          if not chapters and existing_chapters.is_file() and existing_chapters.read_text(encoding="utf-8").strip():
              chapters_lines = [l for l in existing_chapters.read_text(encoding="utf-8").splitlines() if l.strip()]
          elif isinstance(chapters, str):
              chapters_lines = [l.strip() for l in chapters.splitlines() if l.strip()]
          elif isinstance(chapters, list):
              for ch in chapters:
                  if isinstance(ch, dict):
                      sc_idx = ch.get("scene_index")
                      if isinstance(sc_idx, int) and 1 <= sc_idx <= len(actual_timings):
                          tc = fmt_chapter_time(float(actual_timings[sc_idx - 1]["scene_start"]))
                      else:
                          tc = str(ch.get("timecode") or ch.get("start_time") or "00:00").strip()
                      title = str(ch.get("title") or f"Scene {sc_idx or ''}").strip()
                      chapters_lines.append(f"{tc} {title}")
                  elif isinstance(ch, str) and ch.strip():
                      chapters_lines.append(ch.strip())
          if not chapters_lines:
              chapters_lines = ["00:00 Intro"]
          existing_chapters.write_text("\n".join(chapters_lines) + "\n", encoding="utf-8")
          qc["chapters_count"] = len(chapters_lines)
          qc_path.write_text(json.dumps(qc, ensure_ascii=False, indent=2), encoding="utf-8")

          release_md = [
              f"# Release Card: {video_title}", "",
              f"- **Project:** `{project_name}`",
              f"- **Channel:** `{manifest.get('channel', '@Histoviva')}`",
              f"- **Duration:** `{duration_sec:.2f}s` (`{fmt_chapter_time(duration_sec)}`)",
              f"- **File Size:** `{size_mb:.1f} MB`",
              f"- **Resolution / FPS:** `{width}x{height} @ {fps_real}fps`",
              f"- **Loudness:** `-14 LUFS / -1 dBTP`",
              f"- **SRT:** `{', '.join(created_srts) if created_srts else 'none'}`",
              "", "## YouTube Chapters", "", *chapters_lines, "",
          ]
          (out_dir / "RELEASE_CARD.md").write_text("\n".join(release_md), encoding="utf-8")

          shorts_cfg = manifest.get("shorts_factory") or ui_montage.get("shorts_factory") or {}
          raw_shorts_flag = (shorts_cfg.get("enabled") if isinstance(shorts_cfg, dict) and "enabled" in shorts_cfg
                             else manifest.get("generate_shorts", ui_montage.get("generate_shorts", render_cfg.get("generate_shorts", False))))
          if to_bool(raw_shorts_flag, default=False):
              shorts_dir = out_dir / "shorts"
              shorts_dir.mkdir(parents=True, exist_ok=True)
              raw_hooks = shorts_cfg.get("hook_texts") or ui_montage.get("hook_texts") or []
              fallback_hook = shorts_cfg.get("hook_text") or ui_montage.get("hook_text") or "WAIT FOR THE 14TH SECOND..."
              shorts_count = int(shorts_cfg.get("shorts_count") or ui_montage.get("shorts_count") or len(raw_hooks) or 3)
              shorts_count = max(1, min(3, shorts_count))
              offsets = [0.0, max(0.0, duration_sec * 0.35)] if shorts_count == 2 else [
                  0.0, max(0.0, duration_sec * 0.35), max(0.0, duration_sec * 0.70)]
              font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
              for i, start_t in enumerate(offsets[:shorts_count], 1):
                  clip_len = min(30.0, max(5.0, duration_sec - start_t))
                  short_out = shorts_dir / f"{project_name}_Short_0{i}.mp4"
                  hook_str = (raw_hooks[i - 1] if i - 1 < len(raw_hooks) else fallback_hook).strip()
                  vf_chain = "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1"
                  vf_chain += f",fade=t=in:st=0:d=0.6,fade=t=out:st={max(0.0, clip_len - 0.6):.2f}:d=0.6"
                  if hook_str:
                      safe_text = (hook_str.replace("\\", "").replace(":", "\\:")
                                   .replace("'", "\u2019").replace("%", "\\%"))
                      vf_chain += (f",drawtext=fontfile={font_path}:text='{safe_text}':"
                                   f"fontcolor=white:fontsize=54:line_spacing=10:x=(w-text_w)/2:y=240:"
                                   f"box=1:boxcolor=black@0.68:boxborderw=24:"
                                   f"shadowcolor=black@0.85:shadowx=3:shadowy=3")
                  af_chain = (f"afade=t=in:st=0:d=0.6,afade=t=out:st={max(0.0, clip_len - 0.6):.2f}:d=0.6,"
                              f"loudnorm=I=-14:TP=-1:LRA=11")
                  subprocess.run([
                      "ffmpeg", "-y", "-ss", f"{start_t:.2f}", "-t", f"{clip_len:.2f}",
                      "-i", str(main_video), "-vf", vf_chain, "-af", af_chain,
                      "-c:v", "libx264", "-crf", "20", "-preset", "fast", "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "192k", "-ar", "48000", "-ac", "2",
                      "-movflags", "+faststart", str(short_out),
                  ], check=True)
              print(f"✅ Generated {shorts_count} Shorts in output/shorts/")
          else:
              print("⏭️ Shorts Factory disabled by manifest — skipped.")

          preview_720p = out_dir / f"{project_name}_720p_preview.mp4"
          if not preview_720p.is_file():
              subprocess.run([
                  "ffmpeg", "-y", "-i", str(main_video),
                  "-vf", "scale=1280:720",
                  "-c:v", "libx264", "-crf", "24", "-preset", "veryfast", "-pix_fmt", "yuv420p",
                  "-c:a", "copy", "-movflags", "+faststart", str(preview_720p),
              ], check=True)
          preview_mb = preview_720p.stat().st_size / (1024 * 1024)
          print(f"✅ 720p preview ({preview_mb:.1f} MB) ready!")

          import os
          gh_env = os.environ.get("GITHUB_ENV")
          if gh_env:
              with open(gh_env, "a", encoding="utf-8") as f:
                  f.write(f"QC_SUMMARY={fmt_chapter_time(duration_sec)} • {size_mb:.0f} MB • {width}x{height}\n")
          EOF
      - name: Upload Output Video, Shorts & Metadata to Google Drive
        if: ${{ github.event.inputs.preflight_only != 'true' }}
        env:
          GDRIVE_FOLDER_ID: ${{ env.EFFECTIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "❌ GDRIVE_FOLDER_ID не задан для выгрузки!" >&2
            exit 1
          fi
          DEST="${GDRIVE_REMOTE}:_RENDER_OUTPUT_${PROJECT_NAME}/"
          rclone copy output/ "$DEST" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --exclude "_build_*/**" --transfers 2 --checkers 4 --tpslimit 4 \
            --retries 3 --low-level-retries 5 --stats 30s --progress
          if [ -f "qc_report.json" ]; then
            rclone copy qc_report.json "$DEST" --drive-root-folder-id "$GDRIVE_FOLDER_ID" --tpslimit 2 -v
          fi
          echo "✅ Выгрузка в Google Drive завершена: _RENDER_OUTPUT_${PROJECT_NAME}"
      - name: Upload QC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scene-render-metadata
          path: |
            qc_report.json
            output/output_chapters.txt
            output/RELEASE_CARD.md
            output/*.srt
            build/actual_timings.json
          if-no-files-found: ignore
      - name: Send Telegram Notification
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT: ${{ github.event.inputs.preflight_only }}
        run: |
          python3 - << 'EOF'
          import json, os, time, urllib.request
          from pathlib import Path

          bot = (os.environ.get("TG_TOKEN") or "").strip()
          chat = (os.environ.get("TG_CHAT_ID") or "").strip()
          if not bot or not chat:
              print("ℹ️ Telegram secrets не заданы, пропускаем уведомление.")
              raise SystemExit(0)
          project = os.environ.get("PROJECT_NAME") or "output"
          status = os.environ.get("JOB_STATUS", "unknown")
          mins = int(time.time()) - int(os.environ.get("START_TS", str(int(time.time()))))
          mins = mins // 60
          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          qc_info = ""
          if Path("qc_report.json").is_file():
              qc = json.loads(Path("qc_report.json").read_text(encoding="utf-8"))
              qc_info = (f"\n⏱ {qc.get('duration_formatted', '?')} • 📦 {qc.get('file_size_mb', '?')} MB"
                         f" • 🎬 сцен: {qc.get('scenes', '?')} • глав: {qc.get('chapters_count', '?')}")
          if os.environ.get("PREFLIGHT") == "true" and status == "success":
              msg = f"🔍 Preflight пройден для {project}: все ассеты найдены на Google Drive.\n⏱ {mins} мин"
          elif status == "success":
              msg = f"✅ AetherFlow Render завершён: {project}{qc_info}\n⏱ Сборка: {mins} мин\n🔗 {run_url}"
          else:
              msg = f"❌ AetherFlow Render упал (статус: {status}) для {project}.\n⏱ Прошло: {mins} мин\n🔗 {run_url}"
          payload = json.dumps({"chat_id": chat, "text": msg, "disable_web_page_preview": True}).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{bot}/sendMessage",
              data=payload, headers={"Content-Type": "application/json"}, method="POST")
          try:
              urllib.request.urlopen(req, timeout=20)
          except Exception as e:
              print(f"[TG] Warning: {e}")
          EOF