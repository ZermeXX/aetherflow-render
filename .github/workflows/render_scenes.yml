name: Render Scenes Pipeline

on:
  workflow_dispatch:
    inputs:
      manifest_payload:
        description: 'JSON or Base64 payload from Web Studio'
        required: false
        default: '{}'
      gdrive_folder_id:
        description: 'Target Google Drive Folder ID'
        required: false
        default: ''
      preflight_only:
        description: 'Check scene assets on Google Drive without rendering'
        required: false
        default: 'false'

jobs:
  assemble_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Record Start Time
        run: echo "START_TS=$(date +\%s)" >> $GITHUB_ENV

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl jq python3
          curl https://rclone.org/install.sh | sudo bash

      - name: Setup Personal Rclone Config
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          printf "%s\n" "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Parse Studio Manifest Payload
        env:
          RAW_PAYLOAD: ${{ github.event.inputs.manifest_payload }}
          INPUT_FOLDER_ID: ${{ github.event.inputs.gdrive_folder_id }}
        run: |
          python3 - << 'EOF'
          import os, base64, json, shutil, subprocess

          raw = os.environ.get("RAW_PAYLOAD", "").strip()
          folder_override = os.environ.get("INPUT_FOLDER_ID", "").strip()
          manifest_saved = False

          if raw and raw != "{}":
              try:
                  data = json.loads(raw)
                  with open("manifest.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent=2)
                  manifest_saved = True
                  print("Получен прямой JSON сцен из веб-приложения.")
              except Exception:
                  pass

              if not manifest_saved:
                  try:
                      decoded = base64.b64decode(raw).decode("utf-8")
                      data = json.loads(decoded)
                      with open("manifest.json", "w", encoding="utf-8") as f:
                          json.dump(data, f, ensure_ascii=False, indent=2)
                      manifest_saved = True
                      print("Получен Base64-манифест сцен из веб-приложения.")
                  except Exception:
                      pass

          if not manifest_saved:
              for local_candidate in ["scenes_manifest.json", "manifest.json"]:
                  if os.path.exists(local_candidate) and os.path.getsize(local_candidate) > 0:
                      if local_candidate != "manifest.json":
                          shutil.copy(local_candidate, "manifest.json")
                      manifest_saved = True
                      print(f"Использован локальный файл {local_candidate}.")
                      break

          if not manifest_saved and folder_override:
              print("Скачиваем *manifest*.json из целевой папки Google Drive...")
              subprocess.run([
                  "rclone", "copy", "gdrive:", ".",
                  "--drive-root-folder-id", folder_override,
                  "--include", "*manifest*.json", "-v"
              ], check=False)
              for fname in os.listdir("."):
                  if "manifest" in fname and fname.endswith(".json") and fname != "manifest.json":
                      os.rename(fname, "manifest.json")
                      manifest_saved = True
                      print(f"Скачан манифест: {fname}")
                      break

          if not os.path.exists("manifest.json") or os.path.getsize("manifest.json") == 0:
              raise RuntimeError("Не удалось получить непустой manifest.json для сборки сцен!")

          if folder_override:
              with open("manifest.json", "r", encoding="utf-8") as f:
                  m = json.load(f)
              m.setdefault("cloud_export", {})
              if not m["cloud_export"].get("target_folder_id"):
                  m["cloud_export"]["target_folder_id"] = folder_override
              with open("manifest.json", "w", encoding="utf-8") as f:
                  json.dump(m, f, ensure_ascii=False, indent=2)
          EOF
          ls -lh manifest.json

      - name: Preflight Asset Check
        run: |
          python3 - << 'EOF'
          import json, subprocess

          with open("manifest.json", "r", encoding="utf-8") as f:
              m = json.load(f)

          folder_id = m.get("cloud_export", {}).get("target_folder_id", "")
          scenes = m.get("scenes") or m.get("timeline_slots") or []
          needed = set()

          for s in scenes:
              vid = s.get("file_name") or s.get("video_file") or s.get("asset") or s.get("base_content", {}).get("file_name")
              if vid:
                  needed.add(vid)
              aud = s.get("audio_file") or s.get("voiceover_file")
              if aud:
                  needed.add(aud)

          bg = m.get("background_music") or m.get("audio_rules", {}).get("continuous_bed", {})
          if isinstance(bg, dict) and bg.get("enabled") and bg.get("source_file"):
              needed.add(bg["source_file"])

          if not folder_id:
              print("⚠️ target_folder_id не задан — пропускаем сверку списка папки.")
          else:
              out = subprocess.check_output([
                  "rclone", "lsf", "gdrive:", "--drive-root-folder-id", folder_id
              ]).decode("utf-8").splitlines()
              existing = set(x.strip() for x in out)
              missing = sorted(needed - existing)
              if missing:
                  raise FileNotFoundError(f"На Google Диске отсутствуют файлы сцен: {', '.join(missing)}")
              print(f"✅ Все {len(needed)} видео- и аудиофайлов сцен подтверждены на Google Диске!")
          EOF

      - name: Assemble Scenes with FFmpeg
        if: github.event.inputs.preflight_only != 'true'
        run: |
          set -e
          python3 assemble_scenes.py

      - name: Run Auto-QC, Shorts Factory & Release Card
        if: github.event.inputs.preflight_only != 'true'
        run: |
          OUT_FILE=$(cat final_output_name.txt)
          python3 - "$OUT_FILE" << 'EOF'
          import json, os, re, subprocess, sys

          out_file = sys.argv[1]
          probe = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error", "-show_entries", "format=duration:stream=codec_type",
              "-of", "json", out_file
          ]).decode("utf-8"))

          dur = float(probe["format"]["duration"])
          streams = probe.get("streams", [])
          if not any(s["codec_type"] == "video" for s in streams) or not any(s["codec_type"] == "audio" for s in streams):
              raise RuntimeError("Auto-QC провален: отсутствует видео или аудио поток!")

          lufs_proc = subprocess.run([
              "ffmpeg", "-nostats", "-i", out_file,
              "-filter_complex", "ebur128=framelog=verbose", "-f", "null", "-"
          ], capture_output=True, text=True)
          m = re.findall(r"I:\s*(-?\d+\.\d+)\s*LUFS", lufs_proc.stderr)
          lufs = float(m[-1]) if m else -16.0

          h, rem = divmod(int(round(dur)), 3600)
          mins, secs = divmod(rem, 60)
          dur_fmt = f"{h:02d}:{mins:02d}:{secs:02d}"
          summary = f"{dur_fmt} • {lufs} LUFS"
          print(f"✅ Auto-QC пройден: {summary}")
          with open("qc_summary.txt", "w", encoding="utf-8") as f:
              f.write(summary)

          # Генерация таймкодов сцен и карточки релиза
          with open("manifest.json", "r", encoding="utf-8") as f:
              manifest = json.load(f)

          scenes = manifest.get("scenes") or manifest.get("timeline_slots") or []
          chapters_lines = []
          cur_sec = 0.0
          for idx, sc in enumerate(scenes):
              title = sc.get("title") or sc.get("label") or f"Scene {idx + 1}"
              sh, srem = divmod(int(round(cur_sec)), 3600)
              smin, ssec = divmod(srem, 60)
              chapters_lines.append(f"{sh:02d}:{smin:02d}:{ssec:02d} {title}")
              cur_sec += float(sc.get("duration_sec") or sc.get("slot_duration_sec") or 0)

          ch_filename = f"{os.path.splitext(out_file)[0]}_chapters.txt"
          with open(ch_filename, "w", encoding="utf-8") as cf:
              cf.write("\n".join(chapters_lines) + "\n")

          seo = manifest.get("youtube_seo", {})
          card = [
              f"# RELEASE CARD: {seo.get('title') or out_file}",
              "",
              f"- **Файл мастера:** `{out_file}`",
              f"- **Хронометраж:** {dur_fmt}",
              f"- **Громкость (EBU R128):** {lufs} LUFS",
              "",
              "## Описание для YouTube",
              seo.get("description", "(не задано в манифесте)"),
              "",
              "## Таймкоды сцен",
              "```text",
              "\n".join(chapters_lines),
              "```",
              "",
              "## Теги",
              ", ".join(seo.get("tags", []))
          ]
          with open("RELEASE_CARD.md", "w", encoding="utf-8") as rcf:
              rcf.write("\n".join(card) + "\n")
          EOF
          [ -f "shorts_factory.py" ] && python3 shorts_factory.py

      - name: Upload Output Video, Shorts & Metadata to Google Drive
        if: github.event.inputs.preflight_only != 'true'
        run: |
          OUT_FILE=$(cat final_output_name.txt)
          CHAPTERS_FILE="${OUT_FILE%.*}_chapters.txt"
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // .gdriveFolderId // empty' manifest.json 2>/dev/null || true)

          echo "=== Выгрузка $OUT_FILE и метаданных на Google Диск ==="
          if [ -n "$FOLDER_ID" ]; then
            rclone copy "./$OUT_FILE" gdrive: --drive-root-folder-id "$FOLDER_ID" \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
            [ -f "./$CHAPTERS_FILE" ] && rclone copy "./$CHAPTERS_FILE" gdrive: --drive-root-folder-id "$FOLDER_ID" -v
            [ -f "RELEASE_CARD.md" ] && rclone copy "./RELEASE_CARD.md" gdrive: --drive-root-folder-id "$FOLDER_ID" -v
            if [ -d "shorts_out" ] && [ "$(ls -A shorts_out)" ]; then
              rclone copy "./shorts_out/" "gdrive:Shorts/" --drive-root-folder-id "$FOLDER_ID" -v
            fi
            DRIVE_LINK=$(rclone link "gdrive:$OUT_FILE" --drive-root-folder-id "$FOLDER_ID" 2>/dev/null || echo "")
          else
            rclone copy "./$OUT_FILE" gdrive:AetherFlow_Output/ \
              --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 30s -v
            [ -f "./$CHAPTERS_FILE" ] && rclone copy "./$CHAPTERS_FILE" gdrive:AetherFlow_Output/ -v
            [ -f "RELEASE_CARD.md" ] && rclone copy "./RELEASE_CARD.md" gdrive:AetherFlow_Output/ -v
            if [ -d "shorts_out" ] && [ "$(ls -A shorts_out)" ]; then
              rclone copy "./shorts_out/" "gdrive:AetherFlow_Output/Shorts/" -v
            fi
            DRIVE_LINK=$(rclone link "gdrive:AetherFlow_Output/$OUT_FILE" 2>/dev/null || echo "")
          fi

          FILE_SIZE=$(du -h "./$OUT_FILE" | cut -f1)
          QC_SUMMARY=$(cat qc_summary.txt 2>/dev/null || echo "OK")
          SHORTS_COUNT=$(ls -1 shorts_out/*.mp4 2>/dev/null | wc -l | tr -d ' ')
          echo "DRIVE_LINK=$DRIVE_LINK" >> $GITHUB_ENV
          echo "FILE_SIZE=$FILE_SIZE" >> $GITHUB_ENV
          echo "QC_SUMMARY=$QC_SUMMARY" >> $GITHUB_ENV
          echo "SHORTS_COUNT=$SHORTS_COUNT" >> $GITHUB_ENV

      - name: Send Telegram Notification
        if: always()
        run: |
          STATUS="${{ job.status }}"
          END_TS=$(date +%s)
          ELAPSED=$((END_TS - START_TS))
          MINS=$((ELAPSED / 60))
          OUT_FILE=$(cat final_output_name.txt 2>/dev/null || echo "scenes_master.mp4")

          if [ "${{ github.event.inputs.preflight_only }}" = "true" ] && [ "$STATUS" = "success" ]; then
            MSG="🔍 *Preflight-проверка сцен пройдена!*%0A%0A✅ Все видео- и аудиофайлы найдены на Google Диске."
          elif [ "$STATUS" = "success" ]; then
            MSG="✅ *Повествовательный монтаж сцен готов и прошёл Auto-QC!*%0A%0A📁 *Файл:* \`${OUT_FILE}\` (${FILE_SIZE})%0A🎛 *QC:* ${QC_SUMMARY}%0A⏱ *Время сборки:* ${MINS} мин%0A📝 *Метаданные:* таймкоды и \`RELEASE_CARD.md\` в папке"
            [ "${SHORTS_COUNT:-0}" -gt 0 ] && MSG="${MSG}%0A📱 *Shorts (9:16):* ${SHORTS_COUNT} шт. в подпапке \`Shorts/\`"
            [ -n "$DRIVE_LINK" ] && MSG="${MSG}%0A🔗 [Открыть на Google Диске](${DRIVE_LINK})"
          else
            MSG="❌ *Ошибка при сборке сцен!*%0A%0A⚠️ *Статус:* $STATUS%0A⏱ *Прошло:* ${MINS} мин"
          fi

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true" \
            -d "text=$MSG"
