name: AetherCombine Narrative Scenes Montage to Google Drive

on:
  workflow_dispatch:
    inputs:
      manifest_payload:
        description: 'Base64 encoded narrative manifest'
        required: true
        type: string

jobs:
  render_scenes_pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Python & Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip rclone jq

      - name: Decode Narrative Manifest
        run: |
          echo "${{ inputs.manifest_payload }}" | base64 -d > narrative_manifest.json
          echo "=== Манифест сценария ==="
          cat narrative_manifest.json

      - name: Setup Service Account Rclone Config
        env:
          SA_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > /home/runner/service_account.json
          ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          EOF

          cat << 'EOF' > ~/.config/rclone/rclone.conf
          [gdrive]
          type = drive
          scope = drive
          service_account_file = /home/runner/service_account.json
          EOF

      - name: Download Scenes & Audio from Google Drive
        run: |
          mkdir -p input_scenes
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // empty' narrative_manifest.json)
          echo "Целевой ID папки Google Drive: '$FOLDER_ID'"

          if [ -z "$FOLDER_ID" ] || [ "$FOLDER_ID" = "null" ]; then
            echo "::error::ID папки не найден в манифесте!"
            exit 1
          fi

          echo "Скачивание исходных фрагментов и мастер-аудио..."
          rclone copy "gdrive:" ./input_scenes/ \
            --drive-root-folder-id "$FOLDER_ID" \
            --include "*.mp4" \
            --include "*.mp3" \
            --include "*.wav" \
            --timeout 30s \
            --contimeout 15s \
            --retries 3 \
            --low-level-retries 5 \
            -v

          echo "Скачанные исходники:"
          ls -la ./input_scenes/

      - name: Run Narrative Assembly Pipeline
        run: |
          python3 assemble_scenes.py narrative_manifest.json

      - name: Upload Output Video to Google Drive
        run: |
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // empty' narrative_manifest.json)
          echo "Выгрузка готового фильма в Google Drive..."
          rclone copy ./output/ "gdrive:" \
            --drive-root-folder-id "$FOLDER_ID" \
            --include "*.mp4" \
            --timeout 60s \
            --contimeout 15s \
            --retries 3 \
            -v

      - name: Clean Source Files from Google Drive
        if: success()
        run: |
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // empty' narrative_manifest.json)
          echo "Монтаж завершен. Удаление исходных сцен и аудиофайла с Google Диска..."
          python3 -c "
          import json, subprocess

          with open('narrative_manifest.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          files_to_delete = []
          for s in data.get('scenes', []):
              fn = s.get('file_name')
              if fn:
                  files_to_delete.append(fn)

          audio = data.get('master_audio') or data.get('audio_track', {}).get('file_name')
          if audio:
              files_to_delete.append(audio)

          folder_id = '$FOLDER_ID'
          for fname in set(files_to_delete):
              print(f'Удаление исходника: {fname}')
              subprocess.run([
                  'rclone', 'deletefile',
                  f'gdrive:{fname}',
                  '--drive-root-folder-id', folder_id
              ], check=False)
          "
          echo "Очистка завершена. Итоговый смонтированный 4K фильм сохранен на Диске."
