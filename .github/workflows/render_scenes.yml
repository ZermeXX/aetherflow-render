name: AetherFlow 4K Render Pipeline

on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'Compact JSON manifest from AETHER COMBINE studio'
        required: false
        type: string
        default: ''
      manifest_payload:
        description: 'Alternative manifest payload key'
        required: false
        type: string
        default: ''
      manifest:
        description: 'Legacy manifest key'
        required: false
        type: string
        default: ''
      gdrive_folder_id:
        description: 'Google Drive folder ID with scene assets'
        required: false
        type: string
        default: ''
      folder_id:
        description: 'Alternative Google Drive folder ID key'
        required: false
        type: string
        default: ''
      project_name:
        description: 'Optional project name override'
        required: false
        type: string
        default: ''

env:
  GDRIVE_REMOTE: gdrive
  MANIFEST_PATH: manifest.json

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg & Rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl unzip
          if ! command -v rclone &> /dev/null; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          ffmpeg -version | head -n 1
          rclone version | head -n 1

      - name: Setup Personal Rclone Config
        env:
          RCLONE_CONF_B64: ${{ secrets.RCLONE_CONFIG_BASE64 }}
          RCLONE_CONF_RAW: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONF_B64" ]; then
            echo "$RCLONE_CONF_B64" | base64 -d > ~/.config/rclone/rclone.conf
          elif [ -n "$RCLONE_CONF_RAW" ]; then
            printf "%s\n" "$RCLONE_CONF_RAW" > ~/.config/rclone/rclone.conf
          else
            echo "❌ Не найден секрет RCLONE_CONFIG_BASE64 или RCLONE_CONFIG!" >&2
            exit 1
          fi
          chmod 600 ~/.config/rclone/rclone.conf
          rclone listremotes

      - name: Parse Studio Manifest Payload
        env:
          INPUTS_JSON: ${{ toJson(github.event.inputs) }}
          SECRET_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 - << 'EOF'
          import base64
          import gzip
          import json
          import os
          import subprocess
          from pathlib import Path

          inputs = json.loads(os.environ.get("INPUTS_JSON") or "{}")
          print("📥 Полученные ключи inputs:", list(inputs.keys()))

          raw_candidate = ""
          for key in ("manifest_json", "manifest_payload", "manifest", "manifest_b64", "payload"):
              val = inputs.get(key)
              if isinstance(val, str) and val.strip():
                  raw_candidate = val.strip()
                  print(f"✅ Найден payload в поле inputs.{key} (длина: {len(raw_candidate)} симв.)")
                  break

          if not raw_candidate:
              for key, val in inputs.items():
                  if isinstance(val, str) and (val.strip().startswith("{") or val.strip().startswith("gz:") or len(val.strip()) > 200):
                      raw_candidate = val.strip()
                      print(f"✅ Найден payload в поле inputs.{key}")
                      break

          manifest_data = None

          if raw_candidate:
              decoded = raw_candidate
              if decoded.startswith("gz:"):
                  decoded = gzip.decompress(base64.b64decode(decoded[3:])).decode("utf-8")
              elif not decoded.startswith("{"):
                  try:
                      decoded = base64.b64decode(decoded).decode("utf-8")
                  except Exception:
                      pass
              manifest_data = json.loads(decoded)

          folder_id = (
              (inputs.get("gdrive_folder_id") or "").strip()
              or (inputs.get("folder_id") or "").strip()
              or (manifest_data or {}).get("gdrive_folder_id", "")
              or (manifest_data or {}).get("folder_id", "")
              or os.environ.get("SECRET_FOLDER_ID", "").strip()
          )

          if not manifest_data and folder_id:
              remote = os.environ.get("GDRIVE_REMOTE", "gdrive")
              print("🔍 Ищем *manifest*.json на Google Drive...")
              res = subprocess.run(
                  ["rclone", "lsf", f"{remote}:", "--files-only", "--include", "*manifest*.json", "--drive-root-folder-id", folder_id],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              files = sorted([line.strip() for line in res.stdout.splitlines() if line.strip()])
              if files:
                  subprocess.run(
                      ["rclone", "copyto", f"{remote}:{files[-1]}", "manifest.json", "--drive-root-folder-id", folder_id],
                      check=True,
                  )
                  manifest_data = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
                  print(f"✅ Скачан манифест с Google Drive: {files[-1]}")

          if not manifest_data or not isinstance(manifest_data, dict):
              raise RuntimeError("Failed to obtain non-empty manifest.json for scene assembly!")

          if folder_id and not manifest_data.get("gdrive_folder_id"):
              manifest_data["gdrive_folder_id"] = folder_id

          Path("manifest.json").write_text(json.dumps(manifest_data, ensure_ascii=False, indent=2), encoding="utf-8")
          scenes = manifest_data.get("timeline") or manifest_data.get("scenes") or []
          print(f"✅ manifest.json сохранён ({len(scenes)} сцен)")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as env_f:
                  env_f.write(f"EFFECTIVE_FOLDER_ID={folder_id}\n")
                  env_f.write(f"PROJECT_NAME={manifest_data.get('project_name', 'output')}\n")
          EOF

      - name: Preflight Asset Check
        env:
          SECRET_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          manifest_path = Path(os.getenv("MANIFEST_PATH", "manifest.json"))
          if not manifest_path.is_file():
              print(f"❌ Манифест не найден: {manifest_path}", file=sys.stderr)
              sys.exit(1)

          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          scenes = manifest.get("timeline") or manifest.get("scenes") or []
          if not scenes:
              print("❌ В манифесте не найдено ни одной сцены (timeline / scenes пуст)!", file=sys.stderr)
              sys.exit(1)

          folder_id = (
              os.getenv("EFFECTIVE_FOLDER_ID", "").strip()
              or manifest.get("gdrive_folder_id", "").strip()
              or manifest.get("folder_id", "").strip()
              or os.getenv("SECRET_FOLDER_ID", "").strip()
          )
          remote = os.getenv("GDRIVE_REMOTE", "gdrive")

          remote_files = set()
          if folder_id:
              res = subprocess.run(
                  ["rclone", "lsf", f"{remote}:", "--recursive", "--files-only", "--drive-root-folder-id", folder_id],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              for line in res.stdout.splitlines():
                  clean = line.strip()
                  if clean:
                      remote_files.add(clean)
                      remote_files.add(Path(clean).name)

          missing = []
          verified_video = 0
          verified_audio = 0

          for idx, sc in enumerate(scenes, 1):
              assets = sc.get("assets") or {}
              v_file = (
                  sc.get("file_name")
                  or sc.get("video_file")
                  or assets.get("video_file")
                  or assets.get("image_reference")
              )
              a_file = (
                  sc.get("voiceover_file")
                  or sc.get("audio_file")
                  or assets.get("voiceover_file")
              )

              if not v_file:
                  missing.append(f"Сцена #{idx}: не указано имя видеофайла (file_name / assets.video_file)")
                  continue

              v_exists = (
                  Path(v_file).is_file()
                  or (Path("assets") / v_file).is_file()
                  or (v_file in remote_files)
                  or (Path(v_file).name in remote_files)
              )
              if v_exists:
                  verified_video += 1
              else:
                  missing.append(f"Сцена #{idx}: видеофайл не найден -> {v_file}")

              if a_file:
                  a_exists = (
                      Path(a_file).is_file()
                      or (Path("assets") / a_file).is_file()
                      or (a_file in remote_files)
                      or (Path(a_file).name in remote_files)
                  )
                  if a_exists:
                      verified_audio += 1
                  else:
                      missing.append(f"Сцена #{idx}: аудиофайл не найден -> {a_file}")

          if missing:
              print("❌ Ошибка проверки ассетов перед рендером:", file=sys.stderr)
              for err in missing:
                  print(f"  - {err}", file=sys.stderr)
              sys.exit(1)

          print(f"✅ Verified {len(scenes)} scenes ({verified_video} video, {verified_audio} audio files) on Google Drive!")
          EOF

      - name: Assemble Scenes with FFmpeg
        env:
          GDRIVE_FOLDER_ID: ${{ env.EFFECTIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID }}
        run: |
          set -e
          python3 assemble_scenes.py manifest.json

      - name: Run Auto-QC, Shorts Factory & Release Card
        run: |
          python3 - << 'EOF'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          project_name = manifest.get("project_name", "output")
          video_title = manifest.get("video_title", project_name)
          out_dir = Path("output")
          out_dir.mkdir(parents=True, exist_ok=True)
          main_video = out_dir / f"{project_name}.mp4"

          if not main_video.is_file() or main_video.stat().st_size < 10000:
              raise RuntimeError(f"Auto-QC failed: итоговый видеофайл отсутствует или повреждён ({main_video})")

          # 1. Auto-QC via ffprobe
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration,size:stream=codec_name,width,height,r_frame_rate", "-of", "json", str(main_video)],
              capture_output=True,
              text=True,
              check=True,
          )
          qc_info = json.loads(probe.stdout)
          duration_sec = float(qc_info["format"]["duration"])
          size_mb = int(qc_info["format"]["size"]) / (1024 * 1024)
          print(f"✅ Auto-QC passed: {main_video.name} | {duration_sec:.2f}s | {size_mb:.1f} MB")

          # 2. Export sidecar SRT subtitles (EN, RU, FR, DE, ES)
          def fmt_srt_time(sec: float) -> str:
              ms = int(round(sec * 1000))
              h, rem = divmod(ms, 3600000)
              m, rem = divmod(rem, 60000)
              s, ms = divmod(rem, 1000)
              return f"{h:02d}:{m:02d}:{s:02d},{ms:03d}"

          scenes = manifest.get("timeline") or manifest.get("scenes") or []
          langs = ["en", "ru", "fr", "de", "es"]
          for lang in langs:
              srt_lines = []
              cur_t = 0.0
              idx_sub = 1
              for sc in scenes:
                  dur = float(sc.get("duration_sec") or sc.get("duration") or 10.0)
                  subs = sc.get("subtitles") or {}
                  text = (subs.get(lang) or "").strip()
                  if text:
                      srt_lines.append(f"{idx_sub}\n{fmt_srt_time(cur_t)} --> {fmt_srt_time(cur_t + dur)}\n{text}\n")
                      idx_sub += 1
                  cur_t += dur
              if srt_lines:
                  srt_file = out_dir / f"{project_name}_{lang.upper()}.srt"
                  srt_file.write_text("\n".join(srt_lines), encoding="utf-8")

          # 3. Export output_chapters.txt (English-only YouTube chapters)
          chapters = manifest.get("chapters_youtube") or []
          chapters_lines = [f"{ch.get('timecode', '00:00')} {ch.get('title', 'Chapter')}" for ch in chapters]
          (out_dir / "output_chapters.txt").write_text("\n".join(chapters_lines) + "\n", encoding="utf-8")

          # 4. Export RELEASE_CARD.md (English release metadata)
          release_md = [
              f"# Release Card: {video_title}",
              "",
              f"- **Project:** `{project_name}`",
              f"- **Channel:** `{manifest.get('channel', '@Histoviva')}`",
              f"- **Duration:** `{duration_sec:.2f}s` (`{manifest.get('total_duration_formatted', '')}`)",
              f"- **File Size:** `{size_mb:.1f} MB`",
              f"- **Resolution / FPS:** `3840x2160 @ 24fps`",
              "",
              "## YouTube Chapters",
              "",
              *chapters_lines,
              "",
          ]
          (out_dir / "RELEASE_CARD.md").write_text("\n".join(release_md), encoding="utf-8")

          # 5. Shorts Factory (3 vertical 9:16 30s highlights)
          shorts_dir = out_dir / "shorts"
          shorts_dir.mkdir(parents=True, exist_ok=True)
          offsets = [0.0, max(0.0, duration_sec * 0.35), max(0.0, duration_sec * 0.70)]
          for i, start_t in enumerate(offsets, 1):
              clip_len = min(30.0, max(5.0, duration_sec - start_t))
              short_out = shorts_dir / f"{project_name}_Short_0{i}.mp4"
              subprocess.run(
                  [
                      "ffmpeg", "-y",
                      "-ss", f"{start_t:.2f}",
                      "-t", f"{clip_len:.2f}",
                      "-i", str(main_video),
                      "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1",
                      "-c:v", "libx264", "-crf", "20", "-preset", "fast", "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "192k",
                      str(short_out),
                  ],
                  check=True,
              )
          print("✅ Metadata, SRT files, RELEASE_CARD.md, and 3 Shorts generated!")
          EOF

      - name: Upload Output Video, Shorts & Metadata to Google Drive
        env:
          GDRIVE_FOLDER_ID: ${{ env.EFFECTIVE_FOLDER_ID || secrets.GDRIVE_FOLDER_ID }}
        run: |
          if [ -z "$GDRIVE_FOLDER_ID" ]; then
            echo "❌ GDRIVE_FOLDER_ID не задан для выгрузки!" >&2
            exit 1
          fi
          rclone copy output/ "${GDRIVE_REMOTE}:_RENDER_OUTPUT_${PROJECT_NAME}/" \
            --drive-root-folder-id "$GDRIVE_FOLDER_ID" \
            --progress
          echo "✅ Выгрузка в Google Drive завершена: _RENDER_OUTPUT_${PROJECT_NAME}"

      - name: Send Telegram Notification
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "ℹ️ Telegram secrets не заданы, пропускаем уведомление."
            exit 0
          fi
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="✅ AetherFlow Render завершён: ${PROJECT_NAME:-output} (4K + Shorts + SRT + RELEASE_CARD загружены на Google Drive)"
          else
            MSG="❌ AetherFlow Render упал (статус: ${JOB_STATUS}) для проекта ${PROJECT_NAME:-output}. Проверьте логи GitHub Actions."
          fi
          curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || echo "⚠️ Telegram API timeout (игнорируем, чтобы не ронять джобу)"
