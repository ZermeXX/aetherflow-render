name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg, fonts & Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow pyyaml
          ffmpeg -version | head -n 1
      - name: Python syntax check
        run: python -m compileall -q .
      - name: Workflow YAML lint
        run: |
          python - << 'EOF'
          import glob, yaml
          files = sorted(glob.glob(".github/workflows/*.yml"))
          for f in files:
              with open(f, encoding="utf-8") as fh:
                  yaml.safe_load(fh)
              print("YAML OK:", f)
          if not files:
              raise SystemExit("No workflow files found")
          EOF
      - name: Unit tests & FFmpeg graph smoke
        run: python -m unittest discover -s tests -p "test_*.py" -v
